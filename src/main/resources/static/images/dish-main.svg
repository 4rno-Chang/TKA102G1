<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 菜品插畫：主餐 — 炙烤牛排、烤馬鈴薯、蘆筍 -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6e2dc"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3a22"/><stop offset="1" stop-color="#4a2415"/>
    </linearGradient>
    <radialGradient id="pink" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#d9606a"/><stop offset=".75" stop-color="#b84a4f"/><stop offset="1" stop-color="#8a3a30"/>
    </radialGradient>
    <radialGradient id="potato" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#f3c96a"/><stop offset="1" stop-color="#c98a2e"/>
    </radialGradient>
    <g id="slice">
      <rect x="-26" y="-70" width="52" height="140" rx="16" fill="url(#crust)"/>
      <rect x="-19" y="-62" width="38" height="124" rx="12" fill="url(#pink)"/>
    </g>
    <g id="asparagus">
      <rect x="0" y="-6" width="170" height="12" rx="6" fill="#6b9a3d"/>
      <path d="M160 -9 q24 9 0 18 z" fill="#4f7a2b"/>
      <path d="M40 -6 l8 6 l-8 6 M90 -6 l8 6 l-8 6" fill="none" stroke="#557f30" stroke-width="2"/>
    </g>
  </defs>

  <!-- 深色石板桌面 -->
  <rect width="1000" height="600" fill="#2e2a28"/>
  <g stroke="#262220" stroke-width="3" fill="none">
    <path d="M0 120 Q400 100 1000 140"/><path d="M0 300 Q500 320 1000 290"/><path d="M0 470 Q450 450 1000 480"/>
  </g>
  <!-- 刀叉 -->
  <g fill="#bdbdbd">
    <rect x="80" y="140" width="12" height="330" rx="6"/>
    <rect x="68" y="100" width="36" height="90" rx="10"/>
    <rect x="890" y="200" width="12" height="270" rx="6"/>
    <path d="M884 90 Q920 150 902 210 H890 Z"/>
  </g>

  <!-- 盤子 -->
  <circle cx="505" cy="318" r="250" fill="#000" opacity=".3"/>
  <circle cx="495" cy="300" r="248" fill="url(#plate)"/>
  <circle cx="495" cy="300" r="188" fill="none" stroke="#dcd6cc" stroke-width="3"/>

  <!-- 醬汁 -->
  <path d="M330 420 C 400 460, 520 470, 640 400" stroke="#6e2a1c" stroke-width="22" stroke-linecap="round" fill="none" opacity=".9"/>
  <path d="M340 420 C 410 455, 520 462, 630 402" stroke="#8a3a26" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- 蘆筍 -->
  <use href="#asparagus" transform="translate(320 200) rotate(-20)"/>
  <use href="#asparagus" transform="translate(330 225) rotate(-17)"/>
  <use href="#asparagus" transform="translate(340 250) rotate(-14)"/>

  <!-- 牛排切片 -->
  <use href="#slice" transform="translate(470 330) rotate(18)"/>
  <use href="#slice" transform="translate(522 322) rotate(18)"/>
  <use href="#slice" transform="translate(574 314) rotate(18)"/>
  <use href="#slice" transform="translate(626 306) rotate(18)"/>
  <!-- 烤痕 -->
  <g stroke="#2a140c" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M608 250 l24 -8 M612 280 l24 -8"/>
  </g>

  <!-- 烤馬鈴薯 -->
  <g>
    <circle cx="360" cy="330" r="34" fill="url(#potato)"/>
    <circle cx="330" cy="380" r="30" fill="url(#potato)"/>
    <circle cx="392" cy="378" r="28" fill="url(#potato)"/>
    <g fill="#8a5a1c" opacity=".5"><circle cx="370" cy="320" r="5"/><circle cx="340" cy="372" r="4"/><circle cx="398" cy="370" r="4"/></g>
  </g>
  <!-- 迷迭香 -->
  <g stroke="#3c5e2a" stroke-width="3" stroke-linecap="round">
    <path d="M640 180 L700 130"/>
    <path d="M650 172 l-6 -14 M662 162 l-6 -14 M674 152 l-6 -14 M686 142 l-6 -14 M650 172 l14 6 M662 162 l14 6 M674 152 l14 6 M686 142 l14 6"/>
  </g>
  <!-- 海鹽與胡椒 -->
  <g fill="#fff"><circle cx="530" cy="280" r="2.5"/><circle cx="600" cy="330" r="2.5"/><circle cx="490" cy="300" r="2"/></g>
  <g fill="#111"><circle cx="545" cy="340" r="2.5"/><circle cx="480" cy="270" r="2"/><circle cx="640" cy="290" r="2"/></g>
</svg>
