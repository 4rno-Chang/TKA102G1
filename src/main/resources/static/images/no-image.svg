  <g fill="none" stroke="#a3927f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="160" y="88" width="80" height="62" rx="8"/>
    <circle cx="181" cy="108" r="7"/>
    <path d="m164 144 22-22 14 14 12-10 24 18"/>
  </g>
  <text x="200" y="196" text-anchor="middle" fill="#8c7d70"
    font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="500" letter-spacing="2">尚未上傳圖片</text>
