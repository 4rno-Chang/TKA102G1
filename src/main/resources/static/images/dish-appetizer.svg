<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 菜品插畫：開胃菜 — 卡布里沙拉（番茄 + 莫札瑞拉 + 羅勒） -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6e2dc"/>
    </radialGradient>
    <radialGradient id="tomato" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e2513f"/><stop offset="1" stop-color="#b3261e"/>
    </radialGradient>
    <radialGradient id="cheese" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#ece6d5"/>
    </radialGradient>
    <g id="basil">
      <path d="M0 0 C 12 -22, 44 -22, 58 0 C 44 16, 12 16, 0 0 Z" fill="#3f7d2c"/>
      <path d="M4 0 H52" stroke="#2c5c1e" stroke-width="2"/>
    </g>
  </defs>

  <!-- 木桌 -->
  <rect width="1000" height="600" fill="#4a3a30"/>
  <g stroke="#3d2f26" stroke-width="3" fill="none" opacity=".8">
    <path d="M0 80 Q300 60 600 90 T1000 70"/><path d="M0 210 Q350 230 700 200 T1000 220"/>
    <path d="M0 360 Q250 340 520 370 T1000 350"/><path d="M0 500 Q300 520 650 490 T1000 510"/>
  </g>
  <!-- 餐巾 + 叉子 -->
  <rect x="770" y="120" width="160" height="380" rx="6" fill="#efe9df" transform="rotate(6 850 310)"/>
  <g transform="rotate(6 850 310)" fill="#c9c9c9">
    <rect x="845" y="250" width="12" height="220" rx="6"/>
    <rect x="833" y="150" width="36" height="110" rx="10"/>
  </g>
  <g transform="rotate(6 850 310)" fill="#efe9df">
    <rect x="840" y="140" width="5" height="70"/><rect x="849" y="140" width="5" height="70"/><rect x="858" y="140" width="5" height="70"/>
  </g>

  <!-- 盤子 -->
  <ellipse cx="440" cy="318" rx="248" ry="248" fill="#000" opacity=".25"/>
  <circle cx="430" cy="300" r="245" fill="url(#plate)"/>
  <circle cx="430" cy="300" r="185" fill="none" stroke="#dcd6cc" stroke-width="3"/>

  <!-- 番茄與起司交錯排成一圈 -->
  <g>
    <g transform="rotate(0 430 300)"><circle cx="430" cy="170" r="52" fill="url(#tomato)"/><circle cx="430" cy="170" r="22" fill="#e87a62" opacity=".6"/></g>
    <g transform="rotate(45 430 300)"><circle cx="430" cy="170" r="50" fill="url(#cheese)"/></g>
    <g transform="rotate(90 430 300)"><circle cx="430" cy="170" r="52" fill="url(#tomato)"/><circle cx="430" cy="170" r="22" fill="#e87a62" opacity=".6"/></g>
    <g transform="rotate(135 430 300)"><circle cx="430" cy="170" r="50" fill="url(#cheese)"/></g>
    <g transform="rotate(180 430 300)"><circle cx="430" cy="170" r="52" fill="url(#tomato)"/><circle cx="430" cy="170" r="22" fill="#e87a62" opacity=".6"/></g>
    <g transform="rotate(225 430 300)"><circle cx="430" cy="170" r="50" fill="url(#cheese)"/></g>
    <g transform="rotate(270 430 300)"><circle cx="430" cy="170" r="52" fill="url(#tomato)"/><circle cx="430" cy="170" r="22" fill="#e87a62" opacity=".6"/></g>
    <g transform="rotate(315 430 300)"><circle cx="430" cy="170" r="50" fill="url(#cheese)"/></g>
  </g>
  <!-- 中間的芝麻葉 -->
  <g fill="#5b8f3a">
    <path d="M400 290 q30 -40 60 -10 q-30 30 -60 10z"/>
    <path d="M420 320 q40 -20 50 20 q-40 10 -50 -20z" fill="#4a7d2f"/>
    <path d="M395 315 q-10 -40 30 -40 q0 40 -30 40z" fill="#6a9e45"/>
  </g>
  <!-- 羅勒葉 -->
  <use href="#basil" transform="translate(470 160) rotate(30)"/>
  <use href="#basil" transform="translate(540 330) rotate(110)"/>
  <use href="#basil" transform="translate(330 380) rotate(-150)"/>
  <use href="#basil" transform="translate(320 220) rotate(-60)"/>
  <!-- 巴薩米克醋點 -->
  <g fill="#3a1e14">
    <circle cx="300" cy="420" r="6"/><circle cx="560" cy="420" r="5"/><circle cx="590" cy="190" r="6"/>
    <circle cx="270" cy="170" r="4"/><circle cx="430" cy="455" r="5"/>
  </g>
  <!-- 黑胡椒 -->
  <g fill="#222">
    <circle cx="440" cy="175" r="2.5"/><circle cx="545" cy="245" r="2.5"/><circle cx="330" cy="300" r="2.5"/>
    <circle cx="440" cy="425" r="2.5"/><circle cx="520" cy="390" r="2"/><circle cx="345" cy="210" r="2"/>
  </g>
</svg>
