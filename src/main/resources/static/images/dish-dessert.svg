<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 菜品插畫：甜點 — 法式烤布蕾佐莓果 -->
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e6e2dc"/>
    </radialGradient>
    <radialGradient id="brulee" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e9b45c"/><stop offset=".7" stop-color="#c98530"/><stop offset="1" stop-color="#9c5c1c"/>
    </radialGradient>
    <radialGradient id="rasp" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#e2466a"/><stop offset="1" stop-color="#a51d43"/>
    </radialGradient>
    <radialGradient id="blue" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#5a6aa8"/><stop offset="1" stop-color="#26305e"/>
    </radialGradient>
    <g id="raspberry">
      <circle r="18" fill="url(#rasp)"/>
      <g fill="#f07a94" opacity=".6"><circle cx="-6" cy="-6" r="4"/><circle cx="6" cy="-4" r="4"/><circle cx="0" cy="6" r="4"/><circle cx="-8" cy="5" r="3"/><circle cx="8" cy="7" r="3"/></g>
      <circle r="4" fill="#7a1230"/>
    </g>
    <g id="blueberry">
      <circle r="12" fill="url(#blue)"/>
      <path d="M-3 -2 l3 3 l3 -3" stroke="#1b2244" stroke-width="2" fill="none"/>
    </g>
    <g id="mint">
      <path d="M0 0 C 10 -20, 38 -20, 46 0 C 36 14, 10 14, 0 0 Z" fill="#5fa35a"/>
      <path d="M4 0 H42" stroke="#3f7a3c" stroke-width="2"/>
    </g>
  </defs>

  <!-- 淺色大理石桌面 -->
  <rect width="1000" height="600" fill="#e9e5df"/>
  <g stroke="#d4cec6" stroke-width="3" fill="none">
    <path d="M-20 90 C 200 160, 300 40, 520 120 S 860 60, 1020 140"/>
    <path d="M-20 420 C 180 380, 380 520, 620 440 S 900 520, 1020 460"/>
  </g>
  <!-- 甜點匙 -->
  <g fill="#b8b8b8">
    <rect x="828" y="250" width="12" height="240" rx="6"/>
    <ellipse cx="834" cy="210" rx="28" ry="46"/>
  </g>

  <!-- 盤子 -->
  <circle cx="455" cy="315" r="245" fill="#000" opacity=".12"/>
  <circle cx="445" cy="300" r="245" fill="url(#plate)"/>
  <circle cx="445" cy="300" r="185" fill="none" stroke="#e0dad0" stroke-width="3"/>

  <!-- 烤盅 -->
  <circle cx="445" cy="300" r="150" fill="#fff" stroke="#e2ddd4" stroke-width="4"/>
  <circle cx="445" cy="300" r="128" fill="url(#brulee)"/>
  <!-- 焦糖脆面的深色斑 -->
  <g fill="#7a4414" opacity=".55">
    <ellipse cx="400" cy="260" rx="30" ry="18"/><ellipse cx="490" cy="320" rx="36" ry="20"/>
    <ellipse cx="420" cy="350" rx="22" ry="14"/><ellipse cx="480" cy="240" rx="18" ry="10"/>
  </g>
  <!-- 敲開的裂紋 -->
  <path d="M450 190 L430 250 L470 290 L440 340" fill="none" stroke="#5c3010" stroke-width="3" stroke-linejoin="round"/>

  <!-- 莓果與薄荷 -->
  <use href="#raspberry" transform="translate(520 210)"/>
  <use href="#raspberry" transform="translate(552 238)"/>
  <use href="#blueberry" transform="translate(495 185)"/>
  <use href="#blueberry" transform="translate(560 200)"/>
  <use href="#mint" transform="translate(520 245) rotate(-30)"/>

  <!-- 盤緣糖粉與莓果 -->
  <use href="#raspberry" transform="translate(260 430)"/>
  <use href="#blueberry" transform="translate(292 452)"/>
  <use href="#blueberry" transform="translate(620 150)"/>
  <g fill="#fff"><circle cx="630" cy="420" r="3"/><circle cx="645" cy="430" r="2"/><circle cx="620" cy="438" r="2"/><circle cx="250" cy="180" r="3"/><circle cx="262" cy="170" r="2"/></g>
</svg>
