<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜工作面板</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/staff.css}" />
  <script th:src="@{/js/staff.js}" defer></script>
  <script th:src="@{/js/staff-workboard.js}" defer></script>
</head>

<!--
  工作面板：這一頁不放主選單，讓出空間給桌子的卡片（內場、外場的平板會一直停在這頁）。
  左邊的「內場／外場／已完成訂單」三顆按鈕是切換畫面用的，三個畫面用的是同一份訂單資料：

    狀態        外觀        內場畫面            外場畫面
    COOKING     一般        可按「出餐」        顯示「製作中」
    TO_SERVE    黃框        顯示「等待送餐」    可按「確認送達」
    SERVED      劃線變淡    顯示「已送達」      顯示「已送達」

  一桌的餐點全部 SERVED 後，那一桌會從內場、外場消失，改出現在「已完成訂單(未結帳)」。
  卡片的內容由 staff-workboard.js 產生。

  【Thymeleaf 串接】這一頁接上資料庫後要改的地方（往下搜尋「Thymeleaf 串接」可以一個一個找到）：
    1. 左邊的三顆切換按鈕 → 改成連結
    2. 桌子的卡片 → 改用 th:each 產生，每道餐點的按鈕包成小表單
    3. 編輯訂單的對話框 → 改成兩個表單（儲存變更、刪除訂單）
    4. 不同平板之間要同步：在上面的 <head> 裡加上這一行，頁面每 10 秒會自動重新載入
         <meta http-equiv="refresh" content="10">
       但「編輯訂單」的對話框打開時不能重新載入（填到一半的備註會不見），
       所以 Controller 回傳有 editOrder 的頁面時不要加這一行，可以寫成
         <meta th:if="${editOrder == null}" http-equiv="refresh" content="10">
  Controller 要準備哪些資料與網址，列在 StaffPageController.java 開頭的總覽。
-->
<body class="board-layout">

  <aside class="board-side">
    <a class="board-btn board-btn-home" th:href="@{/staff}">返回主頁</a>

    <!-- 【Thymeleaf 串接】三顆切換按鈕改成連結，用網址上的 view 告訴 Controller 要看哪個畫面。
         把 <button type="button" ... data-board-view="kitchen"> 換成（結尾的 </button> 換成 </a>）：
           <a class="board-btn" th:href="@{/staff/workboard(view='kitchen')}"
              th:classappend="${view == 'kitchen'} ? 'active'">
         外場是 view='floor'，已完成訂單是 view='done'（它原本的 board-btn-done 這個 class 要保留）。
         class 裡原本寫死的 active 要拿掉，改由 th:classappend 決定哪一顆是磚紅色。
         說明文字 boardHint 也可以改用 th:text 依照 view 顯示。 -->

    <button type="button" class="board-btn active" data-board-view="kitchen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a4 4 0 1 1 1.500-7.700 4 4 0 0 1 7 0A4 4 0 1 1 17 14v5H7z"/><path d="M7 17h10"/></svg>
      內場
    </button>
    <button type="button" class="board-btn" data-board-view="floor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.500" r="1.800"/><path d="M9 21l2.500-6-2.500-2.500 1-4.500 4 2.500 3 1M11 8l-3.500 2-1 3.500M13.500 15l2.500 6"/></svg>
      外場
    </button>
    <button type="button" class="board-btn board-btn-done" data-board-view="done">
      已完成訂單<br>(未結帳)
    </button>
  </aside>

  <main class="board-main">
    <header class="board-head">
      <!-- 說明文字會依照目前的畫面切換（目前在哪個畫面，看左邊哪顆按鈕是磚紅色） -->
      <p class="board-hint" id="boardHint"></p>
    </header>

    <div class="board-scroll">
      <!-- 左右箭頭：浮在卡片區的左右兩側，平常是半透明，碰到才變清楚。
           那個方向還有卡片時才會出現，由 staff-workboard.js 控制 -->
      <button type="button" class="board-arrow board-arrow-prev" id="boardPrev" aria-label="往左看前面的訂單" hidden>‹</button>
      <button type="button" class="board-arrow board-arrow-next" id="boardNext" aria-label="往右看後面的訂單" hidden>›</button>

      <!-- 桌子的卡片：由 staff-workboard.js 產生 -->
      <!-- 【Thymeleaf 串接】卡片改用 th:each 產生。把下面那行 div 換成這一段
           （欄位名稱是範例，請換成你們 VO 的；view 是 Controller 放進 Model 的 kitchen／floor／done）：

        <div class="board-cards" id="boardCards">
          <p class="board-empty" th:if="${#lists.isEmpty(orders)}">目前沒有進行中的訂單</p>

          <article class="table-card" th:each="order : ${orders}">
            <button type="button" class="table-card-head" data-toggle-card>
              <strong class="table-name" th:text="|${order.table} 桌|">A1 桌</strong>
              <span th:text="|${order.people} 人|">2 人</span>
              <span th:text="${order.time}">12:30</span>
              <span class="table-progress" th:text="|${order.servedCount}/${order.activeCount} 已送達|">1/4 已送達</span>
              <span class="table-toggle">▲ 縮小</span>
            </button>

            <div class="table-card-body">
              <p class="table-note" th:if="${order.note}" th:text="${order.note}">整桌備註</p>

              <ul class="dish-list">
                <li th:each="item : ${order.items}">

                  （1）可以按的餐點：包在小表單裡，按下去就送到 Controller。
                       內場是 COOKING 的餐點送到 toServe，外場是 TO_SERVE 的餐點送到 served
                  <form th:if="${view == 'kitchen' and item.status == 'COOKING' and !item.cancelled}"
                        th:action="@{/staff/workboard/toServe}" method="post">
                    <input type="hidden" name="itemId" th:value="${item.id}">
                    <button type="submit" class="dish is-cooking">
                      <span class="dish-tag" th:text="${item.category}">主菜</span>
                      <span class="dish-name">
                        <span th:text="${item.name}">品名</span>
                        <small class="dish-note" th:if="${item.note}" th:text="${item.note}">備註</small>
                      </span>
                      <span class="dish-state">出餐 →</span>
                    </button>
                  </form>

                  （2）不能按的餐點：不用表單，直接是一顆 disabled 的按鈕，class 依狀態決定
                       is-to-serve 等待送餐／is-served 已送達／is-cancelled 已取消
                  <button type="button" class="dish" disabled
                          th:classappend="${item.cancelled} ? 'is-cancelled' : (${item.status == 'SERVED'} ? 'is-served' : '')">
                    ...內容同上，最右邊的文字換成「● 等待送餐」「✓ 已送達」「✕ 已取消」
                       已完成訂單的畫面則顯示送達時間 th:text="|${item.servedAt} 送達|"
                  </button>
                </li>
              </ul>

              （3）內場才有的「編輯訂單」：改成連結，Controller 收到後回傳同一頁並打開對話框
              <div class="table-card-foot" th:if="${view == 'kitchen'}">
                <a class="card-link" th:href="@{/staff/workboard/edit(orderId=${order.id})}">編輯訂單</a>
              </div>
            </div>
          </article>
        </div>

           order.servedCount（已送達幾道）和 order.activeCount（沒被取消的共幾道）請在 Java 算好。
           改完後，staff-workboard.js 的第 1、2 區可以刪掉，只留「縮小／展開」和第 3 區的左右箭頭。 -->
      <div class="board-cards" id="boardCards"></div>
    </div>
  </main>

  <!-- =====================================================
       編輯訂單的對話框（內場卡片下方的「編輯訂單」會打開它）
       可以做三件事：1. 填寫備註（整桌的、每道餐點的）　2. 刪除單一道餐點　3. 刪除整筆訂單
       開關與內容由 staff-workboard.js 的第 4 區控制
       ===================================================== -->
  <!-- 【Thymeleaf 串接】對話框接上資料庫後的做法
       1. 打開：卡片上的「編輯訂單」是連結 /staff/workboard/edit?orderId=...，
          Controller 把那筆訂單放進 Model（名稱 editOrder）後回傳這一頁。
          下面那行 div 的 hidden 改成 th:hidden="${editOrder == null}"，有 editOrder 時對話框就會是打開的。
       2. 關閉：背景、右上角的 ×、「取消」都改成連結 <a th:href="@{/staff/workboard}">，回到沒有對話框的頁面。
       3. 標題與內容：桌號、人數、整桌備註用 th:text／th:value 顯示 editOrder 的資料，
          餐點那幾列用 th:each="item : ${editOrder.items}" 產生。
       4. 儲存變更：把「畫面一」和它下面的 footer 一起包在一個表單裡
            <form th:action="@{/staff/workboard/notes}" method="post">
              <input type="hidden" name="orderId" th:value="${editOrder.id}">
              整桌備註的輸入框加上 name="orderNote"
              每道餐點的備註輸入框都加上 name="itemNotes"（同一個名字，Controller 用 List<String> 依順序收）
              「儲存變更」改成 <button type="submit">
            </form>
          刪除單一道餐點：每一列多放一個隱藏欄位
            <input type="hidden" name="cancelledItemIds" th:value="${item.id}" disabled>
          一開始是 disabled（不會被送出）。按「刪除」時用 JS 把它的 disabled 拿掉，按「復原」再加回去，
          Controller 用 List<Integer> cancelledItemIds 收到的就是要刪除的餐點。
       5. 刪除訂單：「畫面二」和它下面的 footer 包在另一個表單裡
            <form th:action="@{/staff/workboard/cancel}" method="post">
              <input type="hidden" name="orderId" th:value="${editOrder.id}">
              <input type="hidden" name="reason" id="deleteReasonInput">
              「確認刪除」改成 <button type="submit">
            </form>
          選刪除原因時，用 JS 把選到的文字填進 deleteReasonInput。
          「刪除訂單」按鈕只在餐點都還沒出餐時顯示，可以由 Controller 算好放進 Model（例如 canCancel），
          按鈕加上 th:if="${canCancel}"。
       6. 訂單與餐點都不要真的從資料庫刪掉，改成標記「已取消」並記下原因與時間，之後才查得到。 -->
  <div class="edit-modal" id="editModal" hidden>
    <!-- 半透明的背景，點一下會關閉對話框 -->
    <div class="edit-backdrop" data-edit-close></div>

    <section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="editHeading">
      <header class="edit-head">
        <div>
          <!-- 桌號由 staff-workboard.js 填入，後面固定接「訂單修改」 -->
          <h2 class="edit-title" id="editHeading">
            <span id="editTitle">A1 桌</span>
            <span class="edit-title-sub">訂單修改</span>
          </h2>
          <!-- 人數、下單時間、訂單編號 -->
          <p class="edit-meta" id="editMeta"></p>
        </div>
        <button type="button" class="edit-close" data-edit-close aria-label="關閉">×</button>
      </header>

      <!-- ========== 畫面一：填寫備註 ========== -->
      <div class="edit-body" id="editNotesView">
        <!-- 常用備註：先點下面要填的欄位，再點這裡的按鈕，文字就會加進那個欄位 -->
        <div class="edit-section">
          <h3 class="edit-label">常用備註 <small>先點要填的欄位，再點這裡</small></h3>
          <div class="chips" id="noteChips">
            <button type="button" class="chip chip-small" data-note-chip="趕時間">趕時間</button>
            <button type="button" class="chip chip-small" data-note-chip="過敏注意">過敏注意</button>
            <button type="button" class="chip chip-small" data-note-chip="餐點一起上">餐點一起上</button>
            <button type="button" class="chip chip-small" data-note-chip="不要香菜">不要香菜</button>
            <button type="button" class="chip chip-small" data-note-chip="不要洋蔥">不要洋蔥</button>
            <button type="button" class="chip chip-small" data-note-chip="不要蒜">不要蒜</button>
            <button type="button" class="chip chip-small" data-note-chip="少鹽">少鹽</button>
            <button type="button" class="chip chip-small" data-note-chip="不辣">不辣</button>
            <button type="button" class="chip chip-small" data-note-chip="醬汁另外放">醬汁另外放</button>
            <button type="button" class="chip chip-small" data-note-chip="晚點再上">晚點再上</button>
          </div>
        </div>

        <div class="edit-section">
          <label class="edit-label" for="editOrderNote">整桌備註</label>
          <input type="text" class="staff-input edit-input" id="editOrderNote" maxlength="40"
            placeholder="例如：客人趕時間、有小朋友" autocomplete="off">
        </div>

        <div class="edit-section">
          <h3 class="edit-label">餐點 <small>可以填備註，或刪除單一道餐點；按「儲存變更」後才會生效</small></h3>
          <!-- 每一道餐點一列：品名、備註的輸入框、刪除按鈕；由 staff-workboard.js 產生 -->
          <ul class="edit-items" id="editItems"></ul>
        </div>
      </div>

      <footer class="edit-foot" id="editNotesFoot">
        <!-- 只有在這一桌的餐點都還沒出餐時才會顯示，由 staff-workboard.js 控制 -->
        <button type="button" class="staff-btn btn-danger-outline" id="editAskDelete">刪除訂單</button>
        <span class="edit-foot-space"></span>
        <button type="button" class="staff-btn" data-edit-close>取消</button>
        <button type="button" class="staff-btn btn-pay" id="editSave">儲存變更</button>
      </footer>

      <!-- ========== 畫面二：確認刪除（按了「刪除訂單」才會換成這個畫面） ========== -->
      <div class="edit-body" id="editDeleteView" hidden>
        <div class="delete-warn">
          <p class="delete-warn-title">確定要刪除這筆訂單嗎？</p>
          <p>刪除後這一桌會從內場、外場和結帳消失，之後只能在「訂單管理」的「已取消」查到。</p>
        </div>

        <div class="edit-section">
          <h3 class="edit-label">刪除原因 <small>必選</small></h3>
          <div class="chips" id="deleteReasons">
            <button type="button" class="chip" data-delete-reason="客人取消">客人取消</button>
            <button type="button" class="chip" data-delete-reason="重複下單">重複下單</button>
            <button type="button" class="chip" data-delete-reason="點錯桌號">點錯桌號</button>
            <button type="button" class="chip" data-delete-reason="食材售完">食材售完</button>
            <button type="button" class="chip" data-delete-reason="其他">其他</button>
          </div>
        </div>
      </div>

      <footer class="edit-foot" id="editDeleteFoot" hidden>
        <button type="button" class="staff-btn" id="editBackToNotes">← 返回</button>
        <span class="edit-foot-space"></span>
        <!-- 選了原因之後才能按 -->
        <button type="button" class="staff-btn btn-danger" id="editConfirmDelete" disabled>確認刪除</button>
      </footer>
    </section>
  </div>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
