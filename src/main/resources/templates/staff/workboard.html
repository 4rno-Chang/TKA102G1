<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜工作面板</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <!-- staff.css：後台共用；workboard.css：這一頁自己的樣式（要寫在 staff.css 後面） -->
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/workboard.css}" />
  <script th:src="@{/js/staff/staff.js}" defer></script>
  <script th:src="@{/js/staff/staff-workboard.js}" defer></script>
</head>


<body class="board-layout">

  <aside class="board-side">
    <a class="board-btn board-btn-home" th:href="@{/staff}">返回主頁</a>

    <!-- 三顆切換的連結。目前是哪個畫面（哪一顆是磚紅色）、說明文字，都是 staff-workboard.js 的 A 區
         依照網址上的 view 決定的，和資料無關，接上資料庫後不用改。 -->
    <a class="board-btn" th:href="${hasKitchen} ? @{/staff/workboard(view='kitchen')} : null" th:classappend="${!hasKitchen} ? 'no-permission'" th:attr="aria-disabled=${!hasKitchen}" data-board-view="kitchen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14a4 4 0 1 1 1.500-7.700 4 4 0 0 1 7 0A4 4 0 1 1 17 14v5H7z"/><path d="M7 17h10"/></svg>
      內場
    </a>
    <a class="board-btn" th:href="${hasFloor} ? @{/staff/workboard(view='floor')} : null" th:classappend="${!hasFloor} ? 'no-permission'" th:attr="aria-disabled=${!hasFloor}" data-board-view="floor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13" cy="4.500" r="1.800"/><path d="M9 21l2.500-6-2.500-2.500 1-4.500 4 2.500 3 1M11 8l-3.500 2-1 3.500M13.500 15l2.500 6"/></svg>
      外場
    </a>
    <a class="board-btn board-btn-done" th:href="@{/staff/workboard(view='done')}" data-board-view="done">
      已完成訂單<br>(未結帳)
    </a>
  </aside>

  <!-- 內容區固定一個畫面高，卡片區佔滿剩下的高度，所以橫向捲軸會固定在畫面最下方（workboard.css 的 .board-main、.board-scroll） -->
  <main class="board-main">
    <header class="board-head">
      <!-- 說明文字會依照目前的畫面切換（由 staff-workboard.js 的 A 區填入） -->
      <p class="board-hint" id="boardHint"></p>
    </header>


   
   <p class="source-line" th:if="${workboardlistAll != null}"></p>
    <div class="board-scroll" th:if="${workboardlistAll != null}">
      <!-- 左右箭頭：那個方向還有卡片時才會出現（由 staff-workboard.js 的 A 區控制） -->
      <button type="button" class="board-arrow board-arrow-prev" aria-label="往左看前面的訂單" hidden>‹</button>
      <button type="button" class="board-arrow board-arrow-next" aria-label="往右看後面的訂單" hidden>›</button>

      <div class="board-cards" id="dbBoardCards">
        <p class="board-empty" th:if="${#lists.isEmpty(workboardlistAll)}"
           th:text="${view == 'done'} ? '目前沒有待結帳的桌子' : '目前沒有進行中的訂單'">目前沒有進行中的訂單</p>

         <article class="table-card" th:each="od : ${workboardlistAll}" th:data-order="${od.orders}"> <!-- WebSocket -->
          <!-- 點這一列可以縮小／展開卡片（由 staff-workboard.js 的 A 區處理，不需要後端） -->
          <button type="button" class="table-card-head" data-toggle-card aria-expanded="true">
            <strong class="table-name" th:text="|${od.seatNo.seatNo} 桌|">A1 桌</strong>
            <span th:text="${#temporals.format(od.ordersTime,'HH:mm')}">12:30</span>
            <span class="table-progress" th:text="|${od.servedCount}/${od.activeCount} 已送達|">1/4 已送達</span>
            <span class="table-toggle">▲ 縮小</span>
          </button>

          <div class="table-card-body">
            <ul class="dish-list">
              <li th:each="item : ${od.ordersDetails}">

                <!-- （1）內場、製作中：按「出餐」→ 等待送餐 -->
               <form th:if="${view == 'kitchen' and item.odStatus == '製作中'}"
                      th:action="@{/staff/workboard/toServe}" method="post">
                  <input type="hidden" name="itemId" th:value="${item.ordersDetailsNo}">
                  <button type="submit" class="dish is-cooking">
                    <th:block th:replace="~{:: dishInfo}"></th:block>
                    <span class="dish-state">出餐 →</span>
                  </button>
                </form>


                <!-- （2）內場、等待送餐：誤觸出餐時再按一次 → 退回製作中。
                     data-confirm：送出前先跳出確認視窗，避免不小心連點兩下（程式在 staff.js 的「送出前先確認」）。
                     Controller 要先確認這道餐點現在仍然是 等待送餐 才退回；外場已經按了「確認送達」就不要動它。 -->
                <form th:if="${view == 'kitchen' and item.odStatus == '等待送餐'}"
                      th:action="@{/staff/workboard/backToCooking}" method="post"
                      th:attr="data-confirm=|要把「${item.meal.mealName}」退回製作中嗎？|">
                  <input type="hidden" name="itemId" th:value="${item.ordersDetailsNo}">
                  <button type="submit" class="dish is-to-serve">
                    <th:block th:replace="~{:: dishInfo}"></th:block>
                    <span class="dish-state">● 等待送餐</span>
                  </button>
                </form>

                <!-- （3）外場、等待送餐：按「確認送達」→ 已送達（Controller 同時記下送達時間） -->
                <form th:if="${view == 'floor' and item.odStatus == '等待送餐'}"
                      th:action="@{/staff/workboard/served}" method="post">
                  <input type="hidden" name="itemId" th:value="${item.ordersDetailsNo}">
                  <button type="submit" class="dish is-to-serve">
                    <th:block th:replace="~{:: dishInfo}"></th:block>
                    <span class="dish-state">確認送達 →</span>
                  </button>
                </form>

                <!-- （4）其他情況都不能按：已取消、已送達、外場看到的製作中。
                     th:unless 的條件就是上面（1）（2）（3）三種情況，符合其中一種就不顯示這一顆。 -->
                <button type="button" class="dish" disabled
                        th:unless="${(view == 'kitchen' and (item.odStatus == '製作中' or item.odStatus == '等待送餐')) or (view == 'floor' and item.odStatus == '等待送餐')}"
                        th:classappend="${item.odStatus == '已取消'} ? 'is-cancelled' : (${item.odStatus == '已送達' and view != 'done'} ? 'is-served' : '')">
                  <th:block th:replace="~{:: dishInfo}"></th:block>
                  <span class="dish-state" th:if="${item.odStatus == '已取消'}">✕ 已取消</span>
                  <span class="dish-state" th:if="${item.odStatus == '已送達' and view != 'done'}">✓ 已送達</span>
                  <span class="dish-state" th:if="${item.odStatus == '已送達' and view == 'done'}" th:text="|${#temporals.format(item.odServedAt,'HH:mm')} 送達|">12:40 送達</span>
                  <span class="dish-state" th:if="${item.odStatus == '製作中'}">製作中</span>
                </button>
              </li>
            </ul>

            <!-- 內場才有的「編輯訂單」：是連結，Controller 收到後回傳同一頁，並多放 editOrder，對話框就會打開 -->
            <div class="table-card-foot" th:if="${view == 'kitchen'}">
              <a class="card-link" th:href="@{/staff/workboard/edit(orderId=${od.orders})}">編輯訂單</a>
            </div>
          </div>
        </article>
      </div>
    </div>
  </main>



  <div class="edit-modal" th:if="${editOrder != null}">
    <!-- 半透明的背景，點一下會關閉對話框 -->
    <a class="edit-backdrop" th:href="@{/staff/workboard}" aria-label="關閉"></a>

    <section class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="dbEditHeading">
      <header class="edit-head">
        <div>
          <h2 class="edit-title" id="dbEditHeading">
            <span th:text="|${editOrder.seatNo.seatNo} 桌|">A1 桌</span>
            <span class="edit-title-sub">訂單修改</span>
          </h2>
          <!-- 下單時間、訂單編號 -->
          <p class="edit-meta" th:text="|${#temporals.format(editOrder.ordersTime,'HH:mm')} 下單　訂單編號 ${editOrder.orders}|"></p>
        </div>
        <a class="edit-close" th:href="@{/staff/workboard}" aria-label="關閉">×</a>
      </header>

      <!-- ========== 畫面一：填寫備註、刪除單一道餐點（表單：儲存變更） ========== -->
      <form class="edit-form" th:action="@{/staff/workboard/notes}" method="post" data-edit-view="notes">
        <input type="hidden" name="orderId" th:value="${editOrder.orders}">

        <div class="edit-body">
          <!-- 常用備註：先點下面要填的欄位，再點這裡的按鈕，文字就會加進那個欄位 -->
          <div class="edit-section">
            <h3 class="edit-label">常用備註 <small>先點要填的欄位，再點這裡</small></h3>
            <div class="chips">
              <button type="button" class="chip chip-small" data-note-chip="趕時間">趕時間</button>
              <button type="button" class="chip chip-small" data-note-chip="過敏注意">過敏注意</button>
              <button type="button" class="chip chip-small" data-note-chip="餐點一起上">餐點一起上</button>
              <button type="button" class="chip chip-small" data-note-chip="不要香菜">不要香菜</button>
              <button type="button" class="chip chip-small" data-note-chip="不要洋蔥">不要洋蔥</button>
              <button type="button" class="chip chip-small" data-note-chip="不要蒜">不要蒜</button>
              <button type="button" class="chip chip-small" data-note-chip="少鹽">少鹽</button>
              <button type="button" class="chip chip-small" data-note-chip="不辣">不辣</button>
              <button type="button" class="chip chip-small" data-note-chip="醬汁另外放">醬汁另外放</button>
              <button type="button" class="chip chip-small" data-note-chip="晚點再上">晚點再上</button>
            </div>
          </div>

          <div class="edit-section">
            <h3 class="edit-label">餐點 <small>可以填備註，或刪除單一道餐點；按「儲存變更」後才會生效</small></h3>
            <ul class="edit-items">
              <!-- 每一道餐點一列：品名、備註的輸入框、刪除按鈕。
                   已經被取消的那一列會有 is-removed 這個 class（品名劃線、輸入框鎖住、按鈕是「復原」）。
                   已經送到客人桌上的餐點不能刪除，按鈕是 disabled 的「已送達」。
                   被取消的列，備註欄位用 readonly（不能用 disabled：disabled 的欄位不會被送出，
                   itemNotes 的數量就會和 itemIds 對不起來）。 -->
              <li class="edit-item" th:each="item : ${editOrder.ordersDetails}"
                  th:classappend="${item.odStatus == '已取消'} ? 'is-removed'">
                <span class="edit-item-name">
                  <span class="dish-tag" th:if="${item.meal.mealType != null}" th:text="${item.meal.mealType.mealtypeName}">主菜</span><!-- 【菜單管理】刪除的菜品類別是 null：不顯示類別標籤 -->
                  <span th:text="${ item.meal.mealName}">品名</span>
                  <span class="dish-qty" th:if="${item.odMealNum> 1}" th:text="|× ${item.odMealNum}|">× 2</span>
                </span>
                <input type="hidden" name="itemIds" th:value="${item.ordersDetailsNo}">
                <input type="text" class="staff-input edit-input" name="itemNotes" maxlength="20"
                       th:value="${item.odComment}" th:readonly="${item.odStatus== '已取消'}"
                       placeholder="備註" autocomplete="off" th:attr="aria-label=|${ item.meal.mealName}的備註|">
                <input type="hidden" name="cancelledItemIds" th:value="${item.ordersDetailsNo}"
                       th:disabled="${item.odStatus != '已取消'}">
                <button type="button" class="staff-btn edit-remove" data-db-remove
                        th:disabled="${item.odStatus == '已送達'}"
                        th:text="${item.odStatus == '已送達'} ? '已送達' : (${item.odStatus == '已取消'} ? '復原' : '刪除')">刪除</button>
              </li>
            </ul>
          </div>
        </div>

        <footer class="edit-foot">
          <!-- 只有在這一桌的餐點都還沒出餐時才顯示（canCancel 由 Controller 算好） -->
          <button type="button" class="staff-btn btn-danger-outline" data-edit-ask-delete th:if="${canCancel}">刪除訂單</button>
          <span class="edit-foot-space"></span>
          <a class="staff-btn" th:href="@{/staff/workboard}">取消</a>
          <button type="submit" class="staff-btn btn-pay">儲存變更</button>
        </footer>
      </form>

      <!-- ========== 畫面二：確認刪除（按了「刪除訂單」才會換成這個畫面；表單：確認刪除） ========== -->
      <form class="edit-form" th:action="@{/staff/workboard/cancel}" method="post" data-edit-view="delete" hidden>
        <input type="hidden" name="orderId" th:value="${editOrder.orders}">

        <div class="edit-body">
          <div class="delete-warn">
            <p class="delete-warn-title">確定要取消這筆訂單嗎？</p>
            <p>刪除後這一桌的餐點會全部標記成「已取消」，並從內場、外場和結帳消失，之後只能在「訂單管理」的「已取消」查到。</p>
          </div>
        </div>

        <footer class="edit-foot">
          <button type="button" class="staff-btn" data-edit-back>← 返回</button>
          <span class="edit-foot-space"></span>
          <button type="submit" class="staff-btn btn-danger">確認取消整筆訂單</button>
        </footer>
      </form>
    </section>
  </div>



  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"
  		th:attr="data-error=${error}"></div>


  <!-- ================================================================
       片段 dishInfo：一道餐點的「分類、品名、數量、備註」。
       上面【資料庫資料】的卡片裡用 th:replace="~{:: dishInfo}" 把它放進每一顆餐點按鈕。
       外面這個 th:remove="all" 的意思是：頁面產生時，這裡定義的地方不要顯示出來（只有被引用的地方才顯示）。
       它用的是引用當下的 item，所以只能放在 th:each="item : ..." 的裡面使用。
       ================================================================ -->
  <th:block th:remove="all">
    <th:block th:fragment="dishInfo">
      <span class="dish-tag" th:if="${item.meal.mealType != null}" th:text="${item.meal.mealType.mealtypeName}">主菜</span><!-- 【菜單管理】刪除的菜品類別是 null：不顯示類別標籤 -->
      <span class="dish-name">
        <span th:text="${item.meal.mealName}">品名</span>
        <span class="dish-qty" th:if="${item.odMealNum > 1}" th:text="|× ${item.odMealNum}|" >×2</span>
        <small class="dish-note" th:if="${!#strings.isEmpty(item.odComment)}" th:text="${item.odComment}">備註</small>
      </span>
    </th:block>
  </th:block>
  
  
  <!-- 錯誤訊息  -->
	<div class="staff-toast" id="staffToast" role="status" aria-live="polite"
	     th:attr="data-error=${error}">
	</div>
</body>

</html>
