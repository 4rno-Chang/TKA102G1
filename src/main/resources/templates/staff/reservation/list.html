<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops 後台｜訂候位管理</title>

<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

<link rel="stylesheet" th:href="@{/css/staff/staff.css}">
<link rel="stylesheet" th:href="@{/css/staff/reservation.css}">

<script th:src="@{/js/staff/staff.js}" defer></script>
<script th:src="@{/js/staff/reservation.js}" defer></script>
</head>

<body class="staff-layout">
	<nav th:replace="~{staff/staff_sidebar :: sidebar('reservations')}"></nav>

	<main class="staff-main">
		<header class="staff-header">
			<div>
				<p class="staff-eyebrow">Bistroops Staff</p>
				<h1 class="rsv-page-title">訂候位管理</h1>
			</div>

			<p class="staff-clock" id="staffClock"></p>
		</header>

		<p class="rsv-alert rsv-alert-success" role="status"
			th:if="${message != null}" th:text="${message}"></p>

		<p class="rsv-alert rsv-alert-error" role="alert"
			th:if="${error != null}" th:text="${error}"></p>

		<div class="rsv-workspace">

			<!-- 左側：選取資料與操作。 -->
			<aside class="staff-card rsv-editor">
				<div class="rsv-mode-tabs">
					<span class="rsv-tab active" aria-current="page"> 訂位 </span>

					<button type="button" class="rsv-tab" data-coming-soon="候位管理">
						候位</button>

					<button type="button" class="rsv-tab" data-coming-soon="現場登記">
						現場</button>
				</div>

				<div class="rsv-editor-empty" th:if="${selectedReservation == null}">
					<span class="rsv-empty-icon" aria-hidden="true">▤</span>
					<h2>選擇一筆訂位</h2>
					<p>點擊右側訂位卡片，在這裡查看資料與管理訂位。</p>
				</div>

				<div th:if="${selectedReservation != null}"
					th:with="r=${selectedReservation}">

					<div class="rsv-editor-heading">
						<h2 th:text="|訂位 #${r.rsvNo}|"></h2>

						<span class="rsv-badge"
							th:classappend="${r.rsvStatus == '預約'
                              ? 'is-booked'
                              : (r.rsvStatus == '實到'
                                  ? 'is-arrived' : 'is-ended')}"
							th:text="${r.rsvStatus}"></span>
					</div>

					<dl class="rsv-info">
						<dt>用餐時間</dt>
						<dd
							th:text="${#temporals.format(
                        r.rsvDt.rsvDtDatetime, 'yyyy/MM/dd HH:mm')}"></dd>

						<dt>聯絡人</dt>
						<dd th:text="${r.member.memName}"></dd>

						<dt>聯絡電話</dt>
						<dd th:text="${r.member.memTel}"></dd>

						<dt>電子郵件</dt>
						<dd
							th:text="${#strings.isEmpty(r.member.memMail)
                        ? '未提供' : r.member.memMail}"></dd>

						<dt>桌型</dt>
						<dd th:text="|${r.seatType.seatTypeNo} 人桌|"></dd>
					</dl>

					<form class="rsv-manage-form"
						th:action="@{/staff/reservations/action}" method="post"
						data-rsv-manage>

						<input type="hidden" name="rsvNo" th:value="${r.rsvNo}"> <input
							type="hidden" name="date" th:value="${selectedDate}"> <input
							type="hidden" name="status" th:value="${selectedStatus}">

						<input type="hidden" name="period" th:value="${selectedPeriod}">

						<input type="hidden" name="keyword" th:value="${selectedKeyword}">

						<label for="staffRsvComment" class="rsv-field-label"> 備註 <small>最多
								50 個字元</small>
						</label>

						<textarea id="staffRsvComment" name="rsvComment" rows="5"
							maxlength="50"
							th:readonly="${r.rsvStatus != '預約'
                                  and r.rsvStatus != '實到'}"
							th:text="${r.rsvComment}"></textarea>

						<button type="submit" class="staff-btn btn-pay rsv-save"
							name="operation" value="comment"
							th:if="${r.rsvStatus == '預約'
                                or r.rsvStatus == '實到'}">
							儲存備註</button>

						<div class="rsv-state-actions" th:if="${r.rsvStatus == '預約'}">

							<button type="submit" class="staff-btn btn-card" name="operation"
								value="arrived">標記實到</button>

							<button type="submit" class="staff-btn" name="operation"
								value="no-show">標記未到</button>

							<button type="submit" class="staff-btn btn-danger-outline"
								name="operation" value="cancel">取消訂位</button>
						</div>
					</form>

					<p class="rsv-editor-hint" th:if="${r.rsvStatus == '預約'}">
						實到僅適用今日訂位；未到只能在用餐時間已到後操作。 變更狀態不會同時儲存尚未送出的備註。</p>
				</div>
			</aside>

			<!-- 右側：查詢與時段卡片。 -->
			<section class="rsv-results" aria-label="訂位查詢">
				<div class="staff-card rsv-search-card">

					<div class="rsv-query-tabs">
						<span class="rsv-tab active" aria-current="page"> 訂位查詢 </span>

						<button type="button" class="rsv-tab" data-coming-soon="候位查詢">
							候位查詢</button>

						<button type="button" class="rsv-tab" data-coming-soon="現場查詢">
							現場查詢</button>
					</div>

					<form th:action="@{/staff/reservations}" method="get"
						class="rsv-search-form">

						<label> 用餐日期 <input type="date" name="date" required
							th:value="${selectedDate}">
						</label> <label> 狀態 <select name="status">
								<option value="" th:selected="${selectedStatus == ''}">
									全部狀態</option>

								<option value="預約" th:selected="${selectedStatus == '預約'}">
									預約</option>

								<option value="實到" th:selected="${selectedStatus == '實到'}">
									實到</option>

								<option value="未到" th:selected="${selectedStatus == '未到'}">
									未到</option>

								<option value="取消" th:selected="${selectedStatus == '取消'}">
									取消</option>
						</select>
						</label> <label class="rsv-search-keyword"> 搜尋 <input
							type="search" name="keyword" maxlength="100"
							placeholder="編號、姓名、電話、備註" th:value="${selectedKeyword}">
						</label>

						<div class="rsv-period-picker">
							<span class="rsv-field-label">用餐時段</span>

							<div class="rsv-period-options">
								<label> <input type="radio" name="period" value="all"
									th:checked="${selectedPeriod == 'all'}"> <span>全部</span>
								</label> <label> <input type="radio" name="period" value="lunch"
									th:checked="${selectedPeriod == 'lunch'}"> <span>中午</span>
								</label> <label> <input type="radio" name="period"
									value="dinner" th:checked="${selectedPeriod == 'dinner'}">
									<span>晚上</span>
								</label>
							</div>
						</div>

						<div class="rsv-search-actions">
							<button type="submit" class="staff-btn btn-pay">查詢</button>

							<a class="staff-btn" th:href="@{/staff/reservations}"> 回到今日 </a>
						</div>
					</form>
				</div>

				<div class="rsv-result-heading">
					<h2 th:text="|${selectedDate} 訂位|"></h2>
					<span th:text="|共 ${resultCount} 筆|"></span>
				</div>

				<div class="staff-card rsv-no-results"
					th:if="${#lists.isEmpty(rsvList)}">
					<h3>沒有符合條件的訂位</h3>
					<p>請調整日期、狀態或搜尋條件。</p>
				</div>

				<!-- 每個時段各自一組卡片。 -->
				<section class="rsv-time-group" th:each="time : ${timeGroups}">

					<div class="rsv-time-heading">
						<h3 th:text="${#temporals.format(time, 'HH:mm')}"></h3>
						<span>用餐時段</span>
					</div>

					<div class="rsv-card-grid">
						<a class="staff-card rsv-booking-card" th:each="r : ${rsvList}"
							th:if="${r.rsvDt.rsvDtDatetime.toLocalTime().equals(time)}"
							th:classappend="${selectedReservation != null
                           and selectedReservation.rsvNo == r.rsvNo}
                           ? 'is-selected'"
							th:attr="aria-current=${selectedReservation != null
                           and selectedReservation.rsvNo == r.rsvNo
                           ? 'true' : null}"
							th:href="@{/staff/reservations(
                           date=${selectedDate},
                           status=${selectedStatus},
                           period=${selectedPeriod},
                           keyword=${selectedKeyword},
                           selectedRsvNo=${r.rsvNo})}">

							<div class="rsv-booking-top">
								<span class="rsv-booking-number" th:text="|#${r.rsvNo}|"></span>

								<span class="rsv-badge"
									th:classappend="${r.rsvStatus == '預約'
                                      ? 'is-booked'
                                      : (r.rsvStatus == '實到'
                                          ? 'is-arrived' : 'is-ended')}"
									th:text="${r.rsvStatus}"></span>
							</div>

							<h4 th:text="${r.member.memName}"></h4>

							<p class="rsv-booking-phone" th:text="${r.member.memTel}"></p>

							<div class="rsv-booking-bottom">
								<strong th:text="|${r.seatType.seatTypeNo} 人桌|"> </strong> <span>查看／管理
									→</span>
							</div>

							<p class="rsv-booking-note"
								th:if="${!#strings.isEmpty(r.rsvComment)}"
								th:text="${r.rsvComment}"></p>
						</a>
					</div>
				</section>
			</section>
		</div>
	</main>

	<div class="staff-toast" id="staffToast" role="status"
		aria-live="polite"></div>
</body>
</html>
