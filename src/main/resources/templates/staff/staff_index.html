<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops 後台｜主頁</title>
<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<!-- staff.css：後台共用；staff_index.css：這一頁自己的樣式（要寫在 staff.css 後面） -->
<link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
<link rel="stylesheet" th:href="@{/css/staff/staff_index.css}" />
<!-- 首次修改密碼彈窗樣式 -->
<link rel="stylesheet" th:href="@{/css/staff/staff_change_password.css}" />
<script th:src="@{/js/staff/staff.js}" defer></script>
<!-- 首次登入修改密碼功能 -->
<script th:src="@{/js/staff/staff_change_password.js}" defer></script>
<!-- 員工個人選單樣式 -->
<link rel="stylesheet" th:href="@{/css/staff/staff_account.css}" />
<!-- 員工個人選單功能 -->
<script th:src="@{/js/staff/staff_account.js}" defer></script>
</head>

<body class="staff-layout">
	<!-- 左邊選單（共用），括號內是目前所在的頁面 -->
	<nav th:replace="~{staff/staff_sidebar :: sidebar('home')}"></nav>

	<main class="staff-main">
		<header class="staff-header">
			<div>
				<p class="staff-eyebrow">Bistroops Staff</p>
			</div>
			<!-- 日期與時間由 staff.js 填入 -->
			<p class="staff-clock" id="staffClock"></p>
		</header>

		<!-- 常用功能的大按鈕 -->
		<section class="home-grid">
			<!-- 每個大按鈕上方的圖示，和左邊選單同一項的圖示相同（從 staff_sidebar.html 複製過來的） -->
			<a class="home-tile tile-red"
				th:href="${hasWorkboard} ? @{/staff/workboard} : null"
				th:classappend="${!hasWorkboard} ? 'no-permission'"
				th:attr="aria-disabled=${!hasWorkboard}" data-permission-link> <svg
					class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
					<rect x="4" y="5" width="16" height="15" rx="2" />
					<path d="M9 5V3h6v2M8 11h8M8 15h5" /></svg> <span
				class="home-tile-title">工作面板</span> <span class="home-tile-desc">內場出餐、外場送餐</span>
			</a> <a class="home-tile tile-yellow"
				th:href="${hasCheckout == true} ? @{/staff/checkout} : null"
				th:classappend="${hasCheckout != true} ? 'no-permission' : ''"
				th:attr="aria-disabled=${hasCheckout != true}" data-permission-link>
				<svg class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
					<circle cx="12" cy="12" r="9" />
					<path
						d="M15 9.5c-.5-1-1.600-1.500-3-1.500-1.700 0-3 .8-3 2s1.300 1.700 3 2 3 .8 3 2-1.300 2-3 2c-1.400 0-2.500-.5-3-1.500M12 6v2M12 16v2" /></svg>
				<span class="home-tile-title">結帳</span> <span class="home-tile-desc">查看餐點明細並收款</span>
			</a> <a class="home-tile tile-green"
				th:href="${hasOrders == true} ? @{/staff/orders} : null"
				th:classappend="${hasOrders != true} ? 'no-permission' : ''"
				th:attr="aria-disabled=${hasOrders != true}" data-permission-link>
				<svg class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true">
					<path d="M8 6h12M8 12h12M8 18h12" />
					<circle cx="4" cy="6" r="1" />
					<circle cx="4" cy="12" r="1" />
					<circle cx="4" cy="18" r="1" /></svg> <span class="home-tile-title">訂單管理</span>
				<span class="home-tile-desc">查詢所有訂單</span>
			</a>
		</section>

		<!-- 訂候位管理：整個長條都可以點，點了前往訂候位的畫面。
         訂候位的頁面還沒做，所以先用 data-coming-soon（點了會跳出「尚未開放」）。
         頁面做好後，把 <button type="button" ... data-coming-soon="訂候位"> 換成
           <a class="staff-card home-bar" th:href="@{/staff/訂候位的網址}">
         結尾的 </button> 換成 </a> 即可。

         這個長條有「兩份」：
           【資料庫資料】用 Thymeleaf 寫好的版本。Controller 還沒把資料放進 Model 時不會出現。
           【假資料】    數字由 staff.js 的「B. 假資料」填入，目前看到的就是這一份。 -->

		<!-- ===== 【資料庫資料】Thymeleaf 串接 =====
         Controller（/staff 的方法）放進 Model：
           nextRoundTime 最近一輪訂位的時間、nextRoundCount 那一輪共幾組、
           waitingCount 目前候位幾組、callingNumber 目前叫到幾號
         只要 nextRoundCount 不是 null，這個長條就會出現在假資料的上面。
         ★★ 上面四個名稱目前都是「範例」★★ 要叫什麼名字請負責的組員自己決定，
         決定後把下面 ${...} 裡的名稱（包含 th:if 裡的 nextRoundCount）改成 Controller 實際放進 Model 的名稱。 -->
		<a class="staff-card home-bar" th:if="${nextRoundCount != null}"
			th:href="${hasBooking == true} ? @{/staff/booking} : null"
			th:classappend="${hasBooking == true} ? '' : 'no-permission'"
			th:attr="aria-disabled=${hasBooking != true}" data-permission-link>
			<span class="home-bar-title">訂候位管理</span> <span
			class="home-bar-stats"> <span class="home-bar-stat">
					最近一輪訂位（ <strong th:text="${nextRoundTime}"></strong> ）共 <strong
					class="home-bar-num" th:text="${nextRoundCount}">0</strong> 組
			</span>
		</span> <span class="home-bar-arrow" aria-hidden="true">›</span>
		</a>

		<!-- ===== 【假資料】四個 <strong> 裡的數字由 staff.js 的「B. 假資料」填入（依照 data-demo-home 的名稱）。
         資料庫的版本確認沒問題後，這個 button 整個刪掉 ===== -->
		<a class="staff-card home-bar" th:if="${nextRoundCount == null}"
			th:href="${hasBooking == true} ? @{/staff/booking} : null"
			th:classappend="${hasBooking == true} ? '' : 'no-permission'"
			th:attr="aria-disabled=${hasBooking != true}" data-permission-link>
			<span class="home-bar-title">訂候位管理<span class="source-tag"
				th:if="${nextRoundCount != null}">假資料</span></span> <span
			class="home-bar-stats"> <span class="home-bar-stat">最近一輪訂位（<strong
					data-demo-home="nextRoundTime"></strong>）共 <strong
					class="home-bar-num" data-demo-home="nextRoundCount"></strong> 組
			</span> <span class="home-bar-stat">目前候位 <strong class="home-bar-num"
					data-demo-home="waitingCount"></strong> 組
			</span> <span class="home-bar-stat">目前叫號 <strong class="home-bar-num"
					data-demo-home="callingNumber"></strong> 號
			</span>
		</span> <span class="home-bar-arrow" aria-hidden="true">›</span>
		</a>
		<!-- ===== 工作備忘錄：每位員工各自一份，存在 Redis（key：staff:worknote:員工編號），換一台平板登入也看得到。
         讀取、儲存的網址是 data-url（EmployeeNoteController），程式在 staff.js 的 A-9 ===== -->
		<section class="staff-card home-note">
			<div class="home-note-head">
				<label class="home-note-label" for="workNote">工作備忘錄</label>
				<small class="home-note-hint">自動儲存，僅本人可見</small>
			</div>
			<textarea class="home-note-input" id="workNote" rows="5" maxlength="1000"
				th:data-url="@{/staff/worknote}"></textarea>
			<p class="home-note-status" id="workNoteStatus" aria-live="polite"></p>
		</section>
	</main>

	<div class="staff-toast" id="staffToast" role="status"
		aria-live="polite"></div>

	<!-- 首次登入修改密碼彈窗 -->
	<div
		th:replace="~{staff/employee/staff_change_password :: passwordModal}"></div>


</body>

</html>
