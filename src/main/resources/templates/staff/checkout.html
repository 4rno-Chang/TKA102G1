<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜結帳</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <!-- staff.css：後台共用；checkout.css：這一頁自己的樣式（要寫在 staff.css 後面） -->
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/checkout.css}" />
  <script th:src="@{/js/staff/staff.js}" defer></script>
  <script th:src="@{/js/staff/checkout.js}" defer></script>
</head>

<body class="staff-layout">
  <nav th:replace="~{staff/staff_sidebar :: sidebar('checkout')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <p class="staff-eyebrow">Checkout</p>
        <h1 class="staff-title">結帳</h1>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>

    <div class="checkout">

      <!-- ==================== 左：尚未結帳的訂單 ==================== -->
      <div class="checkout-col">

        <section class="staff-card checkout-list-card" th:if="${checkoutListout != null}">
          <h2 class="staff-card-title">未結帳的訂單<span class="source-tag source-db">資料庫</span></h2>
          <div class="checkout-list">
            <p class="staff-empty" th:if="${#lists.isEmpty(checkoutListout)}">目前沒有未結帳的訂單</p>

            <div class="checkout-row" th:each="o : ${checkoutListout}"
                 th:classappend="${order != null and order.orders == o.orders} ? 'selected'">
              <span class="badge badge-table" th:text="${o.seatNo.seatNo}">A1</span>
              <span class="checkout-row-info">
                <span class="checkout-row-id" th:text="${o.orders}">訂單編號</span>
                <span class="tag" th:classappend="${o.status=='DONE'} ? 'tag-red' : 'tag-yellow'"
                      th:text="${o.status=='DONE'} ? '待結帳' : '用餐中'">用餐中</span>
              </span>
              <span class="checkout-row-amount" th:text="'$' + ${#numbers.formatInteger(o.ordersActualPrice,1,'COMMA')}">$1,246</span>
              <a class="staff-btn btn-pay" th:href="@{/staff/checkout(order=${o.orders})}">結帳</a>
            </div>
          </div>
        </section>
      </div>

      <!-- ==================== 右：餐點明細 ==================== -->
      <div class="checkout-col checkout-col-receipt">

                <section class="staff-card receipt" th:if="${checkoutListout != null}" th:classappend="${order != null} ? 'open'">
          <p class="receipt-empty" th:if="${order == null}">請從左邊選擇要結帳的訂單<span class="source-tag source-db">資料庫</span></p>

          <div class="receipt-body" th:if="${order != null}">
            <a class="receipt-close" th:href="@{/staff/checkout}" aria-label="關閉餐點明細">×</a>

            <div class="receipt-top">
              <span class="badge badge-table" th:text="${order.seatNo.seatNo}">A1</span>
              <h2 class="receipt-title">餐點明細<span class="source-tag source-db">資料庫</span></h2>
            </div>
            <p class="receipt-meta">訂單編號：<span th:text="${order.orders}"></span></p>
            <p class="receipt-meta">下單時間：<span th:text="${order.ordersTime}"></span></p>

            <table class="receipt-table">
              <thead>
                <tr><th>品項</th><th class="num">數量</th><th class="num">單價</th><th class="num">金額</th><th class="num">折扣</th></tr>
              </thead>
              <tbody>
                <!-- 被取消的餐點不列在明細上（也可以在 Java 先排除，那 th:unless 就不需要了） -->
                <tr th:each="item : ${order.ordersDetails}" th:unless="${item.odStatus == '已取消'}">
                  <td th:text="${item.mealNo.mealName}">品名</td>
                  <td class="num" th:text="${item.odMealNum}">1</td>
                  <td class="num" th:text="${item.odDiscountPrice}">620</td>
                  <td class="num" th:text="${item.odDiscountPrice * item.odMealNum}">620</td>
                  <td class="num discount" th:text="${item.odDiscountTotal!=null and item.odDiscountTotal > 0} ? |-${item.odDiscountTotal}| : ''"></td>
                </tr>
              </tbody>
            </table>

            <dl class="receipt-sum">
              <div><dt>總價</dt><dd th:text="${order.ordersTotal}">0</dd></div>
              <div><dt>總折扣</dt><dd th:text="${order.ordersDiscountTotal}">0</dd></div>
              <div class="receipt-pay"><dt>實付金額</dt><dd th:text="'$' + ${order.ordersActualPrice}">$0</dd></div>
            </dl>

            <!-- 這桌還有餐點沒送達時顯示的提醒 -->
            <p class="receipt-warn" th:if="${order.status=='ACTIVE'}">這桌還有餐點尚未送達</p>

            <form class="receipt-actions" th:action="@{/staff/checkout/pay}" method="post"
                  th:attr="data-confirm=|${order.seatNo.seatNo} 桌收款 ${order.ordersActualPrice} 元，確定結帳嗎？|">
              <input type="hidden" name="order" th:value="${order.orders}">
              <!-- 會員：還沒做，先留按鈕。之後要做會員折扣時，把 data-coming-soon 拿掉，
                   改成輸入會員手機的小表單送到 Controller，由 Controller 算好折扣後回到這一頁 -->
              <button type="button" class="staff-btn" data-coming-soon="會員">會員</button>
              <button type="submit" class="staff-btn btn-card" name="method" value="刷卡">刷卡</button>
              <button type="submit" class="staff-btn btn-cash" name="method" value="現金">現金</button>
            </form>
          </div>
        </section>

      </div>

    </div>
  </main>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
