<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<body>

	<!-- 首次登入修改密碼彈窗 -->
	<div th:fragment="passwordModal" id="firstPasswordModal"
		class="first-password-overlay" th:if="${mustChangePassword}">

		<div class="first-password-modal" role="dialog" aria-modal="true"
			aria-labelledby="firstPasswordTitle">

			<h2 id="firstPasswordTitle">首次登入，請修改密碼</h2>

			<p>為保障帳號安全，請先修改初始密碼。</p>

			<form id="firstPasswordForm">

				<label for="firstOldPassword">原密碼 *</label> <input type="password"
					id="firstOldPassword" autocomplete="current-password" required>

				<label for="firstNewPassword">新密碼 *</label> <input type="password"
					id="firstNewPassword" autocomplete="new-password" required>

				<label for="firstConfirmPassword">確認新密碼 *</label> <input
					type="password" id="firstConfirmPassword"
					autocomplete="new-password" required>

				<p class="first-password-hint">新密碼至少 8 碼，必須包含英文及數字。</p>

				<p id="firstPasswordMessage" role="alert"></p>

				<button type="submit" id="firstPasswordSubmit">確認修改密碼</button>

			</form>

		</div>
	</div>

</body>
</html>
