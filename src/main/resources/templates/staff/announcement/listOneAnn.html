<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜公告查詢結果</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/staff-announcement.css}" />
  <script th:src="@{/js/staff/staff.js}" defer></script>
</head>

<!-- 編號查詢的結果（/staff/announcement/search?annNo=...）
     ann：AnnouncementController 放入的那一則公告；查不到時 Controller 會帶 errorMsg 回公告及QA 的公告分頁 -->
<body class="staff-layout">
  <nav th:replace="~{staff/staff_sidebar :: sidebar('announcement-and-qa')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <a class="ann-back" th:href="@{/staff/announcement}">‹ 公告及QA</a>
        <h1 class="staff-title">公告查詢結果</h1>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>

    <section class="staff-card">
      <p class="staff-empty" th:if="${ann == null}">查無資料</p>

      <article th:if="${ann != null}"
               th:with="scheduled=${ann.annBegin != null and ann.annBegin.isAfter(#temporals.createNow())}">
        <p class="ann-meta">
          <span class="ann-no" th:text="|#${ann.annNo}|">#1</span>
          <time th:datetime="${ann.annBegin}"
                th:text="${#temporals.format(ann.annBegin, 'yyyy-MM-dd HH:mm')}">2026-01-01 12:00</time>
          <span class="tag tag-yellow" th:if="${scheduled}">排程中</span>
          <span class="tag tag-green" th:unless="${scheduled}">已發布</span>
        </p>
        <h2 class="ann-detail-title" th:text="${ann.annTitle}">公告標題</h2>

        <figure class="ann-detail-img" th:if="${ann.annImg != null}">
          <img th:src="@{/staff/announcement/image/{no}(no=${ann.annNo})}" th:alt="${ann.annTitle}">
        </figure>

        <div class="ann-detail-text" th:text="${ann.annText}">公告內容</div>

        <div class="ann-detail-foot ann-actions">
          <a class="staff-btn btn-pay" th:href="@{/staff/announcement/update/{no}(no=${ann.annNo})}">修改</a>
          <form th:action="@{/staff/announcement/delete/{no}(no=${ann.annNo})}" method="post"
                onsubmit="return confirm('確定要刪除這則公告嗎？刪除後無法復原。');">
            <button type="submit" class="staff-btn btn-danger-outline">刪除</button>
          </form>
          <a class="staff-btn" th:href="@{/staff/announcement}">查看所有公告</a>
        </div>
      </article>
    </section>
  </main>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
