<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜公告管理</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <!-- staff.css：後台共用；staff-announcement.css：公告管理各頁自己的版面 -->
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/staff-announcement.css}" />
  <!-- staff.js：左邊選單（尚未開放的提示、後臺管理的摺疊）、右上角時鐘 -->
  <script th:src="@{/js/staff/staff.js}" defer></script>
</head>

<!-- 公告管理首頁（/staff/announcement）
     查詢、新增、修改失敗時，AnnouncementController 也會帶 errorMsg 回到這一頁 -->
<body class="staff-layout">
  <nav th:replace="~{staff/staff_sidebar :: sidebar('announcement')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <p class="staff-eyebrow">Announcements</p>
        <h1 class="staff-title">公告管理</h1>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>

    <p class="ann-alert" th:if="${errorMsg != null}" th:text="${errorMsg}" role="alert">錯誤訊息</p>

    <section class="home-grid">
      <a class="home-tile tile-red" th:href="@{/staff/announcement/list}">
        <svg class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span class="home-tile-title">公告列表</span>
        <span class="home-tile-desc">查看、修改、刪除所有公告</span>
      </a>

      <a class="home-tile tile-green" th:href="@{/staff/announcement/insert}">
        <svg class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span class="home-tile-title">新增公告</span>
        <span class="home-tile-desc">發布新的消息到前台</span>
      </a>

      <!-- 編號查詢：送到 /staff/announcement/search?annNo=... -->
      <div class="home-tile tile-yellow ann-search-tile">
        <svg class="home-tile-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.500-4.500"/></svg>
        <label class="home-tile-title" for="annNo">編號查詢</label>
        <form class="ann-search" th:action="@{/staff/announcement/search}" method="get">
          <input type="number" class="staff-input" id="annNo" name="annNo" min="1" placeholder="輸入公告編號" required>
          <button type="submit" class="staff-btn">查詢</button>
        </form>
      </div>
    </section>
  </main>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
