<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  員工後台的左邊選單（每個後台頁面共用）
  其他頁面要使用時，在 <body> 裡加上這一行，括號內填「目前是哪一頁」：
    <nav th:replace="~{staff/staff_sidebar :: sidebar('checkout')}"></nav>
  可以填的名稱：home / workboard / orders / checkout
  填了之後，對應的選單項目會加上 active 這個 class（變成選取中的樣子）。

  還沒做的頁面：先用 <button data-coming-soon="名稱">，點了會跳出「尚未開放」的提示。
  之後頁面做好了，把那顆 button 換成 <a th:href="@{/staff/網址}"> 即可（寫法參考下面的「結帳」）。
-->
<nav class="staff-side" th:fragment="sidebar(active)" aria-label="後台選單">

  <a class="staff-brand" th:href="@{/staff}" th:classappend="${active == 'home'} ? 'active'">
    <img th:src="@{/images/logo-mark.svg}" alt="">
    <span>主頁</span>
  </a>

  <div class="staff-menu">
    <a class="staff-menu-item" th:href="@{/staff/workboard}" th:classappend="${active == 'workboard'} ? 'active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M9 5V3h6v2M8 11h8M8 15h5"/></svg>
      <span>工作面板</span>
    </a>

    <button type="button" class="staff-menu-item" data-coming-soon="桌位">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h18M6 9v10M18 9v10M9 9v5h6V9"/></svg>
      <span>入座管理</span>
    </button>

    <button type="button" class="staff-menu-item" data-coming-soon="訂候位">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
      <span>訂候位</span>
    </button>

    <a class="staff-menu-item" th:href="@{/staff/orders}" th:classappend="${active == 'orders'} ? 'active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      <span>訂單管理</span>
    </a>

    <a class="staff-menu-item" th:href="@{/staff/checkout}" th:classappend="${active == 'checkout'} ? 'active'">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.600-1.500-3-1.500-1.700 0-3 .8-3 2s1.300 1.700 3 2 3 .8 3 2-1.300 2-3 2c-1.400 0-2.500-.5-3-1.500M12 6v2M12 16v2"/></svg>
      <span>結帳</span>
    </a>

    <button type="button" class="staff-menu-item" data-coming-soon="菜單管理">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/></svg>
      <span>菜單管理</span>
    </button>

    <button type="button" class="staff-menu-item" data-coming-soon="員工管理">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-3.500 2.900-6 6.500-6s6.500 2.500 6.500 6"/><circle cx="17.500" cy="9" r="2.500"/><path d="M17 14.200c2.600.300 4.500 2.300 4.500 5"/></svg>
      <span>員工管理</span>
    </button>
  </div>

  <!-- 【Thymeleaf 串接】員工登入做好後：
       還沒登入時：這顆按鈕換成連到登入頁的連結 <a class="staff-menu-item staff-menu-bottom" th:href="@{/staff/login}">
       登入之後  ：文字改成顯示員工姓名，例如 <span th:text="${session.loginStaff?.name ?: '員工登入'}">員工登入</span>
                   （loginStaff 後面的問號不能省略，沒登入時它是 null，少了問號頁面會出錯）
       另外可以寫一個攔截器（Interceptor），沒登入的人打開 /staff 底下的頁面時，一律轉到登入頁。 -->
  <button type="button" class="staff-menu-item staff-menu-bottom" data-coming-soon="員工登入">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.600-7 8-7s8 3 8 7"/></svg>
    <span>員工登入</span>
  </button>
</nav>

</body>
</html>
