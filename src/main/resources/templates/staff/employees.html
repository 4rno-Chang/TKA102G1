
<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops 後台｜員工管理</title>

<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">
<!-- 後台共用樣式 -->
<link rel="stylesheet" th:href="@{/css/staff/staff.css}">

<!-- 員工管理專用樣式 -->
<link rel="stylesheet" th:href="@{/css/staff/employees.css}">

<!-- 員工個人選單樣式 -->
<link rel="stylesheet" th:href="@{/css/staff/staff_account.css}">

<script th:src="@{/js/staff/staff.js}" defer></script>
<script th:src="@{/js/staff/employees.js}" defer></script>

<!-- 員工個人選單功能 -->
<script th:src="@{/js/staff/staff_account.js}" defer></script>
</head>

<body class="staff-layout" th:attr="data-login-emp-no=${session.employeeNo}">

	<!-- 共用後台側邊欄 -->
	<nav th:replace="~{staff/staff_sidebar :: sidebar('employees')}"></nav>

	<main class="staff-main">
		<header class="staff-header">
			<div>
				<p class="staff-eyebrow">Employee Management</p>
				<h1 class="staff-title">員工管理</h1>
			</div>
			<p class="staff-clock" id="staffClock"></p>
		</header>


		<section class="staff-card">
			<div class="employee-list-header">
				<h2 class="staff-card-title">員工列表</h2>

				<div class="employee-list-actions">
					<button type="button" class="employee-primary-btn"
						id="resetEmployeeSearchBtn">顯示全部</button>
					<button type="button" class="employee-primary-btn"
						id="searchEmployeeBtn">查詢員工</button>
					<button type="button" class="employee-primary-btn"
						id="addEmployeeBtn">＋ 新增員工</button>
				</div>
			</div>

			<p id="employeeDeliveryStatus" class="employee-delivery-status" role="status" hidden></p>
			<div style="overflow-x: auto;">
				<table class="receipt-table">
					<thead>
						<tr>
							<th>員工照片</th>
							<th>員工編號</th>
							<th>員工姓名</th>
							<th>手機號碼</th>
							<th>薪資</th>
							<th>在職狀態</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="employeeTableBody">
						<tr>
							<td colspan="7">正在載入員工資料...</td>
						</tr>
					</tbody>
				</table>
			</div>
		</section>

	</main>


	<!-- 查詢員工視窗 -->
	<div id="employeeSearchModal" class="employee-modal" hidden>
		<div class="employee-modal-content" role="dialog" aria-modal="true"
			aria-labelledby="employeeSearchTitle" aria-describedby="employeeSearchHelp">
			<div class="employee-modal-header">
				<h2 id="employeeSearchTitle">查詢員工</h2>
				<button type="button" id="closeEmployeeSearchModal"
					class="employee-close-btn" aria-label="關閉查詢員工">×</button>
			</div>
			<p id="employeeSearchHelp">單一查詢：填寫姓名或編號。複合查詢：同時填寫兩項，查詢符合所有條件的員工。</p>
			<form id="employeeSearchForm">
				<div class="employee-form-group">
					<label for="searchEmpName">員工姓名（可輸入部分姓名）</label>
					<input type="text" id="searchEmpName" name="empName" maxlength="30">
				</div>
				<div class="employee-form-group">
					<label for="searchEmpNo">員工編號（完整編號）</label>
					<input type="text" id="searchEmpNo" name="empNo" inputmode="numeric" pattern="[0-9]+" title="請輸入數字員工編號">
				</div>
				<div class="employee-form-actions">
					<button type="button" id="cancelEmployeeSearchBtn">取消</button>
					<button type="submit" class="employee-primary-btn">查詢</button>
				</div>
			</form>
		</div>
	</div>

	<!-- 新增員工視窗 -->
	<div id="employeeModal" class="employee-modal" hidden>
		<div class="employee-modal-content">

			<div class="employee-modal-header">
				<h2 id="employeeModalTitle">新增員工</h2>
				<button type="button" id="closeEmployeeModal"
					class="employee-close-btn">×</button>
			</div>

			<form id="employeeForm">

				<div class="employee-form-group">
					<label for="empName">員工姓名 *</label> <input type="text" id="empName"
						name="empName" maxlength="30" required>
				</div>

				<div class="employee-form-group">
					<label for="empTel">手機號碼 *</label> <input type="tel" id="empTel"
						name="empTel" maxlength="10" pattern="09[0-9]{8}" required>
				</div>

				<div class="employee-form-group">
					<label for="empEmail">Email *</label>
					<input type="email" id="empEmail" name="empEmail" maxlength="254" autocomplete="off" required>
					<small>臨時密碼會寄至此信箱；修改信箱後請先儲存，再按「忘記密碼」寄送。</small>
				</div>

				<div class="employee-form-group">
					<label for="empIce">緊急聯絡人</label> <input type="text" id="empIce"
						name="empIce" maxlength="30">
				</div>

				<div class="employee-form-group">
					<label for="empIcetel">緊急聯絡電話</label> <input type="tel"
						id="empIcetel" name="empIcetel" maxlength="10">
				</div>

				<div class="employee-form-group">
					<label for="empAdd">員工地址</label> <input type="text" id="empAdd"
						name="empAdd" maxlength="100">
				</div>

				<div class="employee-form-group">
					<label for="empSal">員工薪資 *</label> <input type="number" id="empSal"
						name="empSal" min="0" step="1" required>
				</div>

				<div class="employee-form-group">
					<fieldset id="employeeInitialPermissions" aria-describedby="employeeInitialPermissionHint employeeInitialPermissionError">
						<legend>初始權限 *</legend>
						<div id="employeeInitialPermissionList"></div>
						<p id="employeeInitialPermissionHint">至少勾選一項，日後仍可透過「權限」調整。</p>
						<p id="employeeInitialPermissionError" role="alert" hidden>請至少勾選一項員工權限</p>
					</fieldset>
				</div>

				<div class="employee-form-group">
					<label for="empPhoto">員工照片（選填）</label>

					<div class="employee-photo-actions">

						<input type="file" id="empPhoto" name="photo"
							accept="image/jpeg,image/png,image/webp" hidden> <label
							for="empPhoto" class="employee-primary-btn employee-photo-btn">
							選擇檔案 </label>

						<button type="button" id="deleteEmployeePhotoBtn"
							class="employee-photo-btn employee-delete-photo-btn">
							刪除照片</button>

					</div>

					<input type="hidden" id="deleteEmployeePhoto" name="deletePhoto"
						value="false"> <img id="employeePhotoPreview"
						class="employee-photo-preview" alt="員工照片預覽" hidden>
				</div>

				<div class="employee-form-actions">
					<button type="button" id="resetEmployeePasswordBtn" hidden>忘記密碼</button>
					<button type="button" id="cancelEmployeeBtn">取消</button>
					<button type="submit" class="employee-primary-btn">儲存員工</button>
				</div>

			</form>
		</div>
	</div>


	<!-- 員工權限設定視窗 -->
	<div id="employeePermissionModal" class="employee-modal" hidden>
		<div class="employee-modal-content">

			<div class="employee-modal-header">
				<h2 id="employeePermissionTitle">員工權限設定</h2>
				<button type="button" id="closePermissionModal"
					class="employee-close-btn">×</button>
			</div>

			<form id="employeePermissionForm">

				<div id="employeePermissionList">正在載入權限資料...</div>

				<div class="employee-form-actions">
					<button type="button" id="cancelPermissionBtn">取消</button>
					<button type="submit" class="employee-primary-btn">儲存權限</button>
				</div>

			</form>
		</div>
	</div>



	<!-- 員工停用／恢復在職確認視窗 -->
	<div id="employeeConfirmModal" class="employee-confirm-overlay" hidden>
		<div class="employee-confirm-box" role="dialog" aria-modal="true"
			aria-labelledby="employeeConfirmMessage">

			<p id="employeeConfirmMessage"></p>

			<div class="employee-confirm-actions">
				<button type="button" id="employeeConfirmCancel">取消</button>
				<button type="button" id="employeeConfirmOk">確定</button>
			</div>
		</div>
	</div>

	<!-- 後台共用 Toast -->
	<div class="staff-toast" id="staffToast" role="status"
		aria-live="polite"></div>


</body>
</html>
