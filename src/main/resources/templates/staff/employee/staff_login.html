<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bistroops 員工登入</title>

    <!-- 員工登入 CSS -->
    <link rel="stylesheet" href="/css/staff/staff_login.css">
</head>

<body>

    <div class="login-box">

        <h1>Bistroops</h1>
        <div class="subtitle">員工後台登入系統</div>

        <section class="account-switch" th:if="${loggedInEmployeeNo != null}" aria-label="目前登入帳號">
            <p>目前已登入「<strong th:text="${loggedInEmployeeName}"></strong>」
                （員工編號 <span th:text="${loggedInEmployeeNo}"></span>）。</p>
            <p class="account-switch-note">若要保留目前登入，請在無痕視窗開啟信件中的網址。</p>
            <div id="accountSwitchActions">
                <button type="button" id="switchAccountBtn">切換帳號</button>
                <a class="login-secondary-btn" href="/staff">返回後台</a>
            </div>
            <div id="accountSwitchConfirm" hidden>
                <p>確定要登出目前帳號嗎？同一瀏覽器的其他分頁也會登出；登入新帳號後將共用新身分。</p>
                <button type="button" id="confirmSwitchAccountBtn">確認登出並切換</button>
                <button type="button" id="cancelSwitchAccountBtn" class="login-secondary-btn">取消</button>
            </div>
        </section>

        <form id="loginForm" th:if="${loggedInEmployeeNo == null}">

            <label for="empNo">員工編號</label>
            <input type="text"
                   id="empNo"
                   inputmode="numeric"
                   placeholder="請輸入員工編號"
                   required>

            <label for="password">密碼</label>
            <input type="password"
                   id="password"
                   placeholder="請輸入密碼"
                   autocomplete="current-password"
                   required>

            <button type="submit">登入</button>

        </form>

        <div id="message" role="alert"></div>

    </div>

    <script>
        const switchAccountBtn = document.getElementById("switchAccountBtn");
        if (switchAccountBtn) {
            const actions = document.getElementById("accountSwitchActions");
            const confirmation = document.getElementById("accountSwitchConfirm");
            const confirmBtn = document.getElementById("confirmSwitchAccountBtn");
            const cancelBtn = document.getElementById("cancelSwitchAccountBtn");
            switchAccountBtn.addEventListener("click", () => {
                actions.hidden = true;
                confirmation.hidden = false;
                cancelBtn.focus();
            });
            cancelBtn.addEventListener("click", () => {
                confirmation.hidden = true;
                actions.hidden = false;
                switchAccountBtn.focus();
            });
            confirmBtn.addEventListener("click", async () => {
                if (confirmBtn.disabled) return;
                confirmBtn.disabled = true;
                cancelBtn.disabled = true;
                const message = document.getElementById("message");
                message.textContent = "";
                try {
                    const response = await fetch("/api/employees/logout", { method: "POST" });
                    if (!response.ok && response.status !== 401) {
                        throw new Error("登出失敗");
                    }
                    window.location.replace("/staff/login");
                } catch (error) {
                    message.textContent = "切換帳號失敗，請稍後再試";
                    confirmBtn.disabled = false;
                    cancelBtn.disabled = false;
                }
            });
        }

        document.getElementById("loginForm")
            ?.addEventListener("submit", async function(event) {

                event.preventDefault();

                const empNo =
                    document.getElementById("empNo").value.trim();

                const password =
                    document.getElementById("password").value;

                const message =
                    document.getElementById("message");

                message.textContent = "";

                try {
                    const response = await fetch(
                        "/api/employees/login",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                empNo: empNo,
                                password: password
                            })
                        }
                    );

                    const result = await response.json();

                    if (!response.ok) {
                        message.textContent =
                            result.message || "登入失敗";
                        return;
                    }

                    // 登入成功後統一進入後台首頁
                    // 首次登入修改密碼彈窗由後端判斷
                    window.location.href = "/staff";

                } catch (error) {
                    message.textContent =
                        "系統發生錯誤，請稍後再試";
                }
            });
    </script>

</body>
</html>
