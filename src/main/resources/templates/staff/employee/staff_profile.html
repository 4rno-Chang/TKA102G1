
<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<body>

	<!-- 員工個人資料共用彈窗 -->
	<div th:fragment="profileModal" id="staffProfileModal"
		class="staff-profile-overlay" hidden>

		<div class="staff-profile-dialog" role="dialog" aria-modal="true"
			aria-labelledby="staffProfileTitle">

			<div class="staff-profile-header">
				<h2 id="staffProfileTitle">員工個人資料</h2>

				<button type="button" id="staffProfileClose" aria-label="關閉">×</button>
			</div>


			<!-- 員工照片：有照片顯示員工照片，沒有則顯示預設頭像 -->
			<div class="staff-profile-photo">

				<img id="staffProfilePhoto" alt="員工照片" hidden> <img
					id="staffProfileNoPhoto" th:src="@{/images/employee-default.svg}"
					alt="預設員工頭像">

				<p>照片由員工管理人員維護</p>

			</div>

			<form id="staffProfileForm">

				<!-- 不可修改 -->
				<label for="staffProfileEmpNo">員工編號</label> <input
					id="staffProfileEmpNo" type="text" readonly> <label
					for="staffProfileEmpName">員工姓名</label> <input
					id="staffProfileEmpName" type="text" readonly> <label
					for="staffProfileEmpTel">員工電話</label> <input
					id="staffProfileEmpTel" type="text" readonly>

				<!-- 可以自行修改 -->
				<label for="staffProfileEmpIce">緊急聯絡人</label> <input
					id="staffProfileEmpIce" type="text"> <label
					for="staffProfileEmpIcetel">緊急聯絡電話</label> <input
					id="staffProfileEmpIcetel" type="tel"> <label
					for="staffProfileEmpAdd">聯絡地址</label> <input
					id="staffProfileEmpAdd" type="text">

				<div class="staff-profile-actions">
					<button type="button" id="staffProfileChangePassword">
						修改密碼</button>

					<button type="submit" id="staffProfileSave">儲存修改</button>
				</div>

			</form>
		</div>
	</div>

	<!-- 一般員工修改密碼彈窗 -->
	<div th:fragment="normalPasswordModal" id="staffNormalPasswordModal"
		class="staff-profile-overlay" style="display: none;">

		<div class="staff-profile-dialog" role="dialog" aria-modal="true"
			aria-labelledby="staffNormalPasswordTitle">

			<div class="staff-profile-header">
				<h2 id="staffNormalPasswordTitle">修改密碼</h2>

				<button type="button" id="staffNormalPasswordClose" aria-label="關閉">×</button>
			</div>

			<p>請輸入新的密碼。</p>

			<form id="staffNormalPasswordForm">

				<label for="staffNormalNewPassword">新密碼 *</label>

				<div class="first-password-input-wrap">
					<input type="password" id="staffNormalNewPassword"
						autocomplete="new-password" required>

					<button type="button" id="staffNormalNewPasswordEye"
						class="staff-password-eye" aria-label="顯示新密碼" aria-pressed="false">

						<svg viewBox="0 0 24 24" width="22" height="22" fill="none"
							stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
							stroke-linejoin="round" aria-hidden="true">

        				 <path d="M3 3l18 18"/>
							<path d="M10.6 6.1A11.6 11.6 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3.1 3.5"/>
							<path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/>
							<path d="M10 10a3 3 0 0 0 4 4"/>
		    			</svg>

					</button>
				</div>

				<div class="first-password-rules">
					<p id="staffNormalPasswordLength">○ 密碼長度至少為 8 個字元</p>

					<p id="staffNormalPasswordFormat">○ 僅能使用英文與數字，且必須同時包含兩者</p>
				</div>

				<label for="staffNormalConfirmPassword">確認新密碼 *</label>

				<div class="first-password-input-wrap">
					<input type="password" id="staffNormalConfirmPassword"
						autocomplete="new-password" required>

					<button type="button" id="staffNormalConfirmPasswordEye"
						class="staff-password-eye" aria-label="顯示確認新密碼"
						aria-pressed="false">

						<svg viewBox="0 0 24 24" width="22" height="22" fill="none"
							stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
							stroke-linejoin="round" aria-hidden="true">

		       			 <path d="M3 3l18 18"/>
							<path d="M10.6 6.1A11.6 11.6 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3.1 3.5"/>
							<path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/>
							<path d="M10 10a3 3 0 0 0 4 4"/>
		    			</svg>
					</button>
				</div>

				<p id="staffNormalPasswordMatch" class="first-password-match"></p>
				<p id="staffNormalPasswordMessage" role="alert"></p>

				<div class="staff-password-actions">
					<button type="button" id="staffNormalPasswordCancel">取消</button>

					<button type="submit" id="staffNormalPasswordSubmit">
						確認修改密碼</button>
				</div>

			</form>
		</div>
	</div>

</body>
</html>
