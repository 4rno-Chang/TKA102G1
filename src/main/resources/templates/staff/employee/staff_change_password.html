<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<body>

	<!-- 首次登入修改密碼彈窗 -->
	<div th:fragment="passwordModal" id="firstPasswordModal"
		class="first-password-overlay" th:if="${mustChangePassword}">

		<div class="first-password-modal" role="dialog" aria-modal="true"
			aria-labelledby="firstPasswordTitle">

			<h2 id="firstPasswordTitle">首次登入，請修改密碼</h2>

			<p>為保障帳號安全，請先修改初始密碼。</p>

			<form id="firstPasswordForm">

				<label for="firstNewPassword">新密碼 *</label>

				<div class="first-password-input-wrap">
					<input type="password" id="firstNewPassword"
						autocomplete="new-password" required>

					<button type="button" class="first-password-eye"
						data-target="firstNewPassword" aria-label="顯示密碼"
						aria-pressed="false">
						<svg viewBox="0 0 24 24" width="22" height="22" fill="none"
							stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
							stroke-linejoin="round" aria-hidden="true">
            <path d="M3 3l18 18"/>
				<path d="M10.6 6.1A11.6 11.6 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3.1 3.5"/>
				<path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/>
				<path d="M10 10a3 3 0 0 0 4 4"/>
        	</svg>
					</button>
				</div>

				<div class="first-password-rules">
					<p id="firstPasswordLength">○ 密碼長度至少為 8 個字元</p>

					<p id="firstPasswordFormat">○ 僅能使用英文與數字，且必須同時包含兩者</p>
				</div>

				<label for="firstConfirmPassword">確認新密碼 *</label>

				<div class="first-password-input-wrap">
					<input type="password" id="firstConfirmPassword"
						autocomplete="new-password" required>

					<button type="button" class="first-password-eye"
						data-target="firstConfirmPassword" aria-label="顯示密碼"
						aria-pressed="false">
						<svg viewBox="0 0 24 24" width="22" height="22" fill="none"
							stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
							stroke-linejoin="round" aria-hidden="true">
					            <path d="M3 3l18 18"/>
					<path d="M10.6 6.1A11.6 11.6 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3.1 3.5"/>
					<path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"/>
					<path d="M10 10a3 3 0 0 0 4 4"/>
        		</svg>
					</button>
				</div>

				<p id="firstPasswordMatch" class="first-password-match"></p>

				<p id="firstPasswordMessage" role="alert"></p>

				<button type="submit" id="firstPasswordSubmit">確認修改密碼</button>

			</form>

		</div>
	</div>

</body>
</html>
