<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜公告及QA</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <!-- staff.css：後台共用（.chips／.chip 也在這裡）；staff-announcement.css：下方 include 進來的列表會用到 -->
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/staff-announcement.css}" />
  <script th:src="@{/js/staff/staff.js}" defer></script>
</head>

<!-- 公告及QA（外殼）
     上方是 chip 切換列（和 orders.html 一樣是連結），下方依 tab include 對應的列表：
       tab = 'qa'            → staff/qa/listAllQas 的 content（QaController，/staff/qa）
       其他（沒給也是）       → staff/announcement/listAllAnns 的 content（AnnouncementController，/staff/announcement）
     側邊選單的「公告及QA」連到 /staff/announcement-and-qa，會轉到 /staff/announcement（預設公告）。
     errorMsg：查詢、新增、修改失敗時 Controller 帶回來的訊息 -->
<body class="staff-layout">
  <nav th:replace="~{staff/staff_sidebar :: sidebar('announcement-and-qa')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <p class="staff-eyebrow">Announcements &amp; QA</p>
        <h1 class="staff-title">公告及QA</h1>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>

    <p class="ann-alert" th:if="${errorMsg != null}" th:text="${errorMsg}" role="alert">錯誤訊息</p>

    <div class="chips ann-tabs">
      <a class="chip" th:href="@{/staff/announcement}" th:classappend="${tab != 'qa'} ? 'active'">公告</a>
      <a class="chip" th:href="@{/staff/qa}" th:classappend="${tab == 'qa'} ? 'active'">常見問題</a>
    </div>

    <div th:replace="${tab == 'qa'} ? ~{staff/qa/listAllQas :: content} : ~{staff/announcement/listAllAnns :: content}"></div>
  </main>

  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
