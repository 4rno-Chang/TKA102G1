<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops 後台｜活動管理</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
  <link rel="stylesheet" th:href="@{/css/staff/staff.css}" />
  <link rel="stylesheet" th:href="@{/css/staff/promote.css}" />
  <script th:src="@{/js/staff/staff.js}" defer></script>
  <script th:src="@{/js/staff/promote.js}" defer></script>
</head>

<!--
  活動管理（列表頁）：查詢活動、看活動詳細、刪除未開始的活動。
  Controller 回傳的名稱是 "staff/promote/promote_list"（這個檔案在 templates/staff/promote/ 資料夾裡）。
  畫面上的資料全部來自資料庫（Controller 放進 Model，這裡用 Thymeleaf 顯示）。

  活動管理有兩個頁面，都放在 templates/staff/promote/：
    promote_list.html（這一頁）  查詢（狀態、搜尋、分頁）＋ 每個活動一張卡片 ＋「活動詳細」的對話框
    promote_form.html            新增／修改活動的表單（新增和修改共用同一頁）
  CSS、JS 兩頁共用同一份：static/css/staff/promote.css、static/js/staff/promote.js。

  這一頁會用到的網址（Controller 是 com.bistroops.promote.controller.PromoteController）：
    GET  /staff/promote                       這一頁：查詢某一頁的活動
    GET  /staff/promote/detail?promoteNo=1    這一頁，並打開「活動詳細」的對話框
    GET  /staff/promote/img?promoteNo=1       輸出活動圖片（卡片和詳細的 <img> 會連到這裡）
    GET  /staff/promote/add                   連到表單頁（新增）
    GET  /staff/promote/edit?promoteNo=1      連到表單頁（修改），從「活動詳細」下方的「修改」連過去
    POST /staff/promote/delete                刪除一筆「未開始」的活動，從「活動詳細」下方的「刪除」送出

  每個活動是一張卡片：上面是滿版的 16:9 圖片，下面是活動名稱、活動期間，最下面一排是狀態和「詳細」按鈕。
  按「詳細」先看全部的資訊，在詳細的下方再按「修改」或「刪除」。
  每種狀態能做的事：未開始 → 可以修改、可以刪除；進行中 → 可以修改（不能改開始日期）、不能刪除；已結束 → 只能看。
  對應資料表「活動 promote」，VO 是 com.bistroops.promote.model.PromoteVO。

    資料表欄位        VO 的屬性        說明
    promote_no        promoteNo        活動編號（資料庫自動產生）
    promote_name      promoteName      活動名稱（最多 10 個字）
    promote_begin     promoteBegin     開始時間（LocalDateTime）
    promote_end       promoteEnd       結束時間（LocalDateTime）
                                       ★ 畫面上只顯示年月日，不顯示幾點幾分
                                         （存進去的時間由 Java 決定：開始是那一天的 00:00，結束是那一天的 23:59）。
    （活動狀態）      沒有這個欄位     ★ 狀態「不存在資料庫」，是用開始、結束時間和現在的時間比出來的：
                                         現在 早於 開始時間 → 未開始
                                         現在 晚於 結束時間 → 已結束
                                         其他（在開始和結束之間）→ 進行中
    promote_content   promoteContent   活動內容
    promote_img       promoteImg       活動圖片。會顯示在首頁的輪播。
                                       ★ 存進資料庫、從資料庫取出來的都是使用者上傳的「原本的圖片」，不會被改動。
                                         只有「顯示」的時候用 CSS 拉成 16:9（object-fit: fill）：首頁輪播、卡片、
                                         活動詳細、表單頁的預覽都一樣。其他比例的圖片會變形，不留白、不裁切。

  要注意：
    ・${...} 用的是 PromoteVO 現在的屬性名稱（p.promoteName 等）。VO 的屬性改了名字，這裡也要跟著改，
      兩邊對不上的話頁面會出現錯誤。
    ・Model 的名稱（promotes、promoteDetail 等）要和 Controller 放進去的名稱相同。
    ・★（之後的優化，可以不做）列表的查詢不要把圖片讀出來：
      做法寫在 PromoteRepository.java 的「之後的優化」。做的時候，這個檔案只要改卡片上判斷有沒有圖片的那兩行（那裡有 ★ 標記）。

  說明放在哪裡（每件事只寫在一個地方）：
    PromoteController.java   每個方法收什麼參數、放什麼進 Model、回傳哪一頁
    PromoteService.java      日期與時間的規則、能不能修改和刪除的規則
    PromoteRepository.java   查詢怎麼寫、之後的優化
    這個檔案                 畫面用到哪些 Model 的名稱和欄位（寫在下面每一塊的上方）
-->
<body class="staff-layout">
  <nav th:replace="~{staff/staff_sidebar :: sidebar('promote')}"></nav>

  <main class="staff-main">
    <header class="staff-header">
      <div>
        <p class="staff-eyebrow">Promote</p>
        <h1 class="staff-title">活動管理</h1>
      </div>
      <p class="staff-clock" id="staffClock"></p>
    </header>


    <!-- ================================================================
         工具列與活動的卡片
         Controller（GET /staff/promote）放進 Model：
           promotes    「這一頁」要顯示的活動（List<PromoteVO>），一頁最多 8 筆，
                       排序：「全部」先依狀態分組（進行中 → 未開始 → 已結束），同一組裡開始日期晚的在前；
                       其他狀態（未開始、進行中、已結束）依結束時間（晚的在前）。
                       ★ 搜尋、狀態、分頁、排序全部由 Java 去資料庫查，一次只查這一頁的 8 筆。
                       查不到資料時要是「空的清單」而不是 null（null 會讓下面整塊不出現）。
           status      目前要看的狀態：空字串（全部）／進行中／未開始／已結束。
                       狀態不存在資料庫，所以查詢時換成「時間的條件」（寫在 PromoteRepository.java）。
           keyword     搜尋的文字（活動名稱裡有這些字）。按「搜尋」時才會送出，由 Java 去資料庫查。
           page        目前是第幾頁（從 1 開始）。網址沒有帶 page 就是第 1 頁。
           totalPages  符合條件的活動總共有幾頁（沒有任何活動時是 1，畫面才會顯示「第 1 / 1 頁」）。
           total       （可以不放）符合條件的活動總共有幾筆，有放的話會顯示在頁數旁邊。
           message   （可以不放）操作完成的訊息，例如「已新增活動」「已刪除活動」。
                     Controller 用 RedirectAttributes 的 addFlashAttribute("message", "...") 帶過來就會顯示。
         ================================================================ -->
    <!-- th:with="now=..."：先把「現在的時間」取出來放進變數 now，下面每一張卡片都用它來判斷狀態。
         #temporals.createNow() 是 Thymeleaf 提供的工具，會回傳現在的 LocalDateTime。 -->
    <div th:if="${promotes != null}" th:with="now=${#temporals.createNow()}">

      <!-- 操作完成的訊息 -->
      <p class="promote-alert promote-alert-ok" th:if="${message != null}" th:text="${message}">已新增活動</p>

      <!-- 工具列：條件都帶在網址上，例如 /staff/promote?status=進行中&keyword=節&page=2
           每一次換狀態、按搜尋、換頁，都是連到這個網址，由 Controller 去資料庫查那一頁的資料（不是在瀏覽器裡篩選）。
             狀態的按鈕：連結，網址帶著目前的關鍵字；沒有帶 page，所以換狀態會回到第 1 頁。
             搜尋      ：關鍵字在 method="get" 的表單裡，按「搜尋」或在搜尋框按 Enter 就會送出；
                         表單裡藏了一個 status，送出時帶著目前的狀態；沒有帶 page，所以搜尋會回到第 1 頁。
             分頁      ：在卡片下面的右下角（見卡片後面的說明）。 -->
      <form class="promote-tools" th:action="@{/staff/promote}" method="get">
        <input type="hidden" name="status" th:value="${status}">

        <div class="chips">
          <a class="chip" th:href="@{/staff/promote(keyword=${keyword})}"
             th:classappend="${status == null or status == ''} ? 'active'">全部</a>
          <!-- 順序跟「全部」的排序一樣：進行中 → 未開始 → 已結束 -->
          <a class="chip" th:href="@{/staff/promote(status='進行中', keyword=${keyword})}"
             th:classappend="${status == '進行中'} ? 'active'">進行中</a>
          <a class="chip" th:href="@{/staff/promote(status='未開始', keyword=${keyword})}"
             th:classappend="${status == '未開始'} ? 'active'">未開始</a>
          <a class="chip" th:href="@{/staff/promote(status='已結束', keyword=${keyword})}"
             th:classappend="${status == '已結束'} ? 'active'">已結束</a>
        </div>

        <!-- 搜尋框和「搜尋」按鈕 -->
        <div class="promote-search">
          <input type="search" class="staff-input" name="keyword" th:value="${keyword}"
                 placeholder="搜尋活動名稱" aria-label="搜尋活動">
          <button type="submit" class="staff-btn">搜尋</button>
        </div>

        <!-- 新增：連到表單頁（promote_form.html）的 /staff/promote/add。
             網址帶著目前的狀態、關鍵字、頁數：表單頁的「返回活動列表」「取消」會用它們回到原本看的這一頁。
             Controller 的 add 方法「不用」收這三個參數，表單頁會自己從網址讀（${param.status} 等）。 -->
        <a class="staff-btn btn-pay" th:href="@{/staff/promote/add(status=${status}, keyword=${keyword}, page=${page})}">＋ 新增活動</a>
      </form>

      <!-- 每個活動一張卡片（th:each）。一張卡片由上到下：
             圖片：滿版、固定 16:9，圖片用 CSS 拉開填滿（和「活動詳細」、首頁輪播的設定相同）。
                   有圖片（promoteImg 不是 null）就用 <img> 顯示，沒有就顯示「尚無圖片」。
                   <img> 的網址是 /staff/promote/img?promoteNo=編號，就是 Controller 那個輸出圖片的方法。
                   ★ 這裡只用 promoteImg 判斷「有沒有圖片」，沒有用到圖片的內容。
                     之後如果把列表的查詢改成不讀圖片的「小物件」（做法在 PromoteRepository.java 的「之後的優化」），
                     下面卡片裡標了 ★ 的兩行要跟著改：p.promoteImg != null 改成 p.hasImg，p.promoteImg == null 改成 !p.hasImg。
             名稱：活動名稱，旁邊小字是活動編號。
             期間：用 #temporals.format 把 LocalDateTime 轉成文字，只顯示年月日（'yyyy/MM/dd'），不顯示幾點幾分。
             最下面一排：左邊狀態的標籤，右邊「詳細」。
             詳細：連到 /staff/promote/detail?promoteNo=編號（同時帶著目前的 status、keyword、page），
                   Controller 回傳同一頁並多放 promoteDetail，
                   「活動詳細」的對話框就會打開；要修改或刪除的話，在那個對話框的下方按。
           卡片上不顯示活動內容（內容在「詳細」裡看）。

           ★ 狀態的判斷式（寫在 article 的 th:with 裡，算出來的文字放進變數 statusText）：
               現在 早於 開始時間（now.isBefore(p.promoteBegin)）→ '未開始'
               否則，現在 晚於 結束時間（now.isAfter(p.promoteEnd)）→ '已結束'
               兩個都不是 → '進行中'
             寫法是「條件 ? 成立時的值 : 不成立時的值」，第二個判斷包在括號裡接在冒號後面。
             前面的「p.promoteBegin != null and」是保險：萬一資料庫裡的時間是空的，不會讓頁面出錯。
             下面的狀態標籤就用 statusText 顯示文字、決定顏色（進行中綠色、未開始黃色、已結束灰色）。
             判斷的規則和 PromoteService 的 getStatus 相同，兩邊要一樣。 -->
      <div class="promote-cards">
        <p class="staff-empty" th:if="${#lists.isEmpty(promotes)}">沒有符合條件的活動</p>

        <article class="promote-card" th:each="p : ${promotes}"
                 th:with="statusText=${p.promoteBegin != null and now.isBefore(p.promoteBegin)} ? '未開始' : (${p.promoteEnd != null and now.isAfter(p.promoteEnd)} ? '已結束' : '進行中')">
          <div class="promote-card-img">
            <!-- ★ 下面兩行的 p.promoteImg：改用「小物件」查詢之後要換成 p.hasImg 和 !p.hasImg（說明在這一塊上方） -->
            <img th:if="${p.promoteImg != null}" th:src="@{/staff/promote/img(promoteNo=${p.promoteNo})}" alt="">
            <th:block th:if="${p.promoteImg == null}">尚無圖片</th:block>
          </div>
          <div class="promote-card-body">
            <h3 class="promote-card-name">
              <span th:text="${p.promoteName}">活動名稱</span><span class="promote-card-no" th:text="|編號 ${p.promoteNo}|">編號 1</span>
            </h3>
            <p class="promote-card-period">
              <span th:text="${#temporals.format(p.promoteBegin, 'yyyy/MM/dd')}">2026/10/01</span> <small>起</small><br>
              <span th:text="${#temporals.format(p.promoteEnd, 'yyyy/MM/dd')}">2026/10/10</span> <small>止</small>
            </p>
            <div class="promote-card-foot">
              <span class="tag"
                    th:classappend="${statusText == '進行中'} ? 'tag-green' : (${statusText == '未開始'} ? 'tag-yellow' : 'tag-gray')"
                    th:text="${statusText}">進行中</span>
              <a class="staff-btn" data-detail-open th:href="@{/staff/promote/detail(promoteNo=${p.promoteNo}, status=${status}, keyword=${keyword}, page=${page})}">詳細</a>
            </div>
          </div>
        </article>
      </div>

      <!-- 分頁：在卡片下面的右下角。「第 幾 / 共幾 頁」，左右兩邊是上一頁、下一頁。
           上一頁、下一頁是連結，網址帶著目前的狀態和關鍵字，page 換成前一頁或後一頁，由 Controller 查那一頁的 8 筆。
           已經是第 1 頁時「上一頁」不能點、最後一頁時「下一頁」不能點（顯示成淡色的 span，不是連結）。
           Controller 要放 page（目前第幾頁，從 1 開始）和 totalPages（總共幾頁）；兩個都有放，這一塊才會出現。
           total（總共幾筆）有放的話會顯示在最左邊，沒放就不顯示。 -->
      <div class="promote-pager" th:if="${page != null and totalPages != null}">
        <span class="promote-pager-total" th:if="${total != null}" th:text="|共 ${total} 筆|">共 12 筆</span>

        <a class="promote-pager-btn" th:if="${page > 1}" aria-label="上一頁"
           th:href="@{/staff/promote(status=${status}, keyword=${keyword}, page=${page - 1})}">‹</a>
        <span class="promote-pager-btn is-disabled" th:unless="${page > 1}">‹</span>

        <span class="promote-pager-text" th:text="|第 ${page} / ${totalPages} 頁|">第 1 / 2 頁</span>

        <a class="promote-pager-btn" th:if="${page < totalPages}" aria-label="下一頁"
           th:href="@{/staff/promote(status=${status}, keyword=${keyword}, page=${page + 1})}">›</a>
        <span class="promote-pager-btn is-disabled" th:unless="${page < totalPages}">›</span>
      </div>
    </div>
  </main>


  <!-- ================================================================
       活動詳細的對話框
       卡片上的「詳細」會打開它：先顯示這筆活動全部的資訊，最下面是「刪除」「修改」「關閉」。

       打開：GET /staff/promote/detail?promoteNo=1
             Controller 用 promoteNo 查出那一筆，放進 Model（名稱 promoteDetail），下面的 th:if 成立，對話框就出現。
             也要放 promotes、status、keyword、page、totalPages（和 /staff/promote 一樣），後面的卡片和分頁才會在。
             「詳細」的網址帶著目前的 status、keyword、page，Controller 用它們查同一頁的卡片。
             查不到那一筆（例如網址被改過）Controller 會 redirect 回 /staff/promote。
       關閉：背景、右上角的 ×、「關閉」都是連結，回到沒有對話框的 /staff/promote，
             網址帶著 status、keyword、page，所以會回到原本看的那一頁。
       不重新載入整頁：「詳細」（data-detail-open）和關閉（data-detail-close）由 promote.js 的第 5 段處理：
             打開時在背景向「詳細」的網址要頁面，只取出這個對話框放到畫面上；關閉時直接把對話框拿掉。
             JS 沒成功（登入過期、斷線…）時，照原本的連結整頁換過去，所以上面的網址都要保留。
       修改：下方的「修改」連到表單頁 /staff/promote/edit?promoteNo=編號（同時帶著 status、keyword、page，
             表單頁的「返回活動列表」會用它們回到這一頁）。
             ★ 已經結束的活動不能修改，所以狀態是「已結束」時沒有「修改」這顆按鈕，只能看和關閉。
       刪除：下方左邊的「刪除」只有狀態是「未開始」時才出現，按了會先跳出確認的視窗，確定之後送到
             POST /staff/promote/delete。Controller 刪除後 redirect 回 /staff/promote 並帶 message。
       狀態：和卡片一樣用時間判斷（th:with 裡的 detailStatus），不是從資料庫拿的。
       圖片：有圖片（promoteImg 不是 null）就用 <img> 顯示，沒有就顯示「尚無圖片」。
             這個框固定 16:9，圖片用 CSS 拉開填滿（promote.css 的 object-fit: fill），和首頁輪播的設定相同，
             所以這裡看到的就是它在首頁上的樣子：不是 16:9 的圖片會變形。圖片檔案本身沒有被改動。
       ================================================================ -->
  <div class="promote-modal" th:if="${promoteDetail != null}"
       th:with="now=${#temporals.createNow()},
                detailStatus=${promoteDetail.promoteBegin != null and now.isBefore(promoteDetail.promoteBegin)} ? '未開始' : (${promoteDetail.promoteEnd != null and now.isAfter(promoteDetail.promoteEnd)} ? '已結束' : '進行中')">
    <!-- 半透明的背景，點一下會關閉對話框 -->
    <a class="promote-backdrop" data-detail-close th:href="@{/staff/promote(status=${status}, keyword=${keyword}, page=${page})}" aria-label="關閉"></a>

    <section class="promote-dialog" role="dialog" aria-modal="true" aria-labelledby="detailHeading">
      <header class="promote-head">
        <h2 class="promote-title" id="detailHeading">活動詳細</h2>
        <a class="promote-close" data-detail-close th:href="@{/staff/promote(status=${status}, keyword=${keyword}, page=${page})}" aria-label="關閉">×</a>
      </header>

      <div class="promote-view">
        <div class="promote-body">
          <dl class="promote-detail">
            <div><dt>活動編號</dt><dd th:text="${promoteDetail.promoteNo}">1</dd></div>
            <div><dt>活動名稱</dt><dd class="promote-detail-name" th:text="${promoteDetail.promoteName}">活動名稱</dd></div>
            <div>
              <dt>活動狀態</dt>
              <dd>
                <span class="tag"
                      th:classappend="${detailStatus == '進行中'} ? 'tag-green' : (${detailStatus == '未開始'} ? 'tag-yellow' : 'tag-gray')"
                      th:text="${detailStatus}">進行中</span>
              </dd>
            </div>
            <div><dt>開始日期</dt><dd th:text="${#temporals.format(promoteDetail.promoteBegin, 'yyyy/MM/dd')}">2026/10/01</dd></div>
            <div><dt>結束日期</dt><dd th:text="${#temporals.format(promoteDetail.promoteEnd, 'yyyy/MM/dd')}">2026/10/10</dd></div>
            <div><dt>活動內容</dt><dd class="promote-detail-content" th:text="${promoteDetail.promoteContent}">活動內容</dd></div>
            <div>
              <dt>活動圖片</dt>
              <dd>
                <div class="promote-detail-img">
                  <img th:if="${promoteDetail.promoteImg != null}"
                       th:src="@{/staff/promote/img(promoteNo=${promoteDetail.promoteNo})}" alt="活動圖片">
                  <th:block th:if="${promoteDetail.promoteImg == null}">尚無圖片</th:block>
                </div>
                <small class="promote-hint">圖片固定用 16:9 顯示，和首頁的輪播相同；不是 16:9 的圖片會被拉成 16:9（會變形）。</small>
              </dd>
            </div>
          </dl>
        </div>

        <footer class="promote-foot">
          <!-- 刪除：只有「未開始」的活動才有這顆按鈕（進行中、已結束的不能刪除）。
               刪除會改到資料，所以用 method="post" 的表單送到 POST /staff/promote/delete，不用連結。
               表單上的 data-confirm 是按下去時要先問的話：staff.js（A-7. 送出前先確認）會跳出確認的對話框，按「取消」就不會送出。
               送出的欄位：promoteNo（要刪除的活動編號），以及 status、keyword、page（列表原本的查詢條件，Java 可以不收）。
               ★ 這只是把按鈕藏起來，表單還是可以自己送，所以 PromoteService 也會確認這筆活動真的是「未開始」才刪。 -->
          <form class="promote-foot-left" th:if="${detailStatus == '未開始'}" th:action="@{/staff/promote/delete}" method="post"
                data-confirm="確定要刪除這個活動嗎？刪除之後無法復原。" data-confirm-warn data-loading=".promote-dialog">
            <input type="hidden" name="promoteNo" th:value="${promoteDetail.promoteNo}">
            <input type="hidden" name="status" th:value="${status}">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="page" th:value="${page}">
            <button type="submit" class="staff-btn btn-danger-outline">刪除</button>
          </form>
          <!-- 修改：已經結束的活動不能修改，狀態是「已結束」時不顯示（detailStatus 是上面用時間算出來的）。
               這只是把按鈕藏起來，網址還是可以自己輸入，所以 Controller 的 edit 和 save 也會擋。 -->
          <a class="staff-btn btn-danger-outline" th:if="${detailStatus != '已結束'}"
             th:href="@{/staff/promote/edit(promoteNo=${promoteDetail.promoteNo}, status=${status}, keyword=${keyword}, page=${page})}">修改</a>
          <a class="staff-btn" data-detail-close th:href="@{/staff/promote(status=${status}, keyword=${keyword}, page=${page})}">關閉</a>
        </footer>
      </div>
    </section>
  </div>

  <!-- 左側選單裡「尚未開放」的項目會用到這個提示框（staff.js），要留著 -->
  <div class="staff-toast" id="staffToast" role="status" aria-live="polite"></div>
</body>

</html>
