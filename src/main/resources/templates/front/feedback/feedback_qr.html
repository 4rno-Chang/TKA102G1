<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bistroops｜用餐回饋</title>
  <link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { background: #f7f1e8; color: #3b2f2a; font-family: "Noto Sans TC", "PingFang TC", sans-serif; padding: 24px 16px; }
    .card { max-width: 480px; margin: 0 auto; background: #fffdf8; border: 1px solid #e8dcc9; border-radius: 18px; padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .meta { color: #8c7d70; font-size: 14px; margin-bottom: 18px; }
    .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: #f1e8d9; }
    .tag.member { background: #c4533b; color: #fff; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; color: #8c7d70; }
    input[type=text], input[type=tel], textarea { width: 100%; padding: 10px; border: 1px solid #e8dcc9; border-radius: 10px; font: inherit; background: #fff; }
    .stars { display: inline-flex; flex-direction: row-reverse; gap: 4px; }
    .stars input { position: absolute; opacity: 0; }
    .stars label { margin: 0; font-size: 32px; color: #e8dcc9; cursor: pointer; }
    .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #dba03c; }
    .error { margin-top: 12px; color: #c4533b; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 12px; background: #c4533b; color: #fff; font-size: 16px; }
    .center { text-align: center; padding: 30px 0; }
  </style>
</head>
<body>
<div class="card">

  <!-- 送出成功 -->
  <div class="center" th:if="${done}">
    <h1>感謝您的回饋！</h1>
    <p class="meta">期待您再次光臨 Bistroops</p>
  </div>

  <!-- token 無效、過期或已經用過 -->
  <div class="center" th:if="${done == null and order == null}">
    <h1>QR Code 已失效</h1>
    <p class="meta">這個 QR Code 已經使用過或已過期，請洽服務人員</p>
  </div>

  <!-- 回饋表單 -->
  <th:block th:if="${done == null and order != null}">
    <h1>用餐回饋</h1>
    <p class="meta">
      訂單編號 <span th:text="${#numbers.formatInteger(order.orders, 8)}"></span>
      ・<span th:text="${#temporals.format(order.ordersTime, 'yyyy/MM/dd HH:mm')}"></span>
    </p>

    <!-- 會員：自動帶入；非會員：要填姓名電話 -->
    <p th:if="${order.member != null}">
      <span class="tag member">會員</span>
      <span th:text="${order.member.memName != null and !order.member.memName.isBlank()} ? ${order.member.memName} : ${order.member.memTel}"></span>
    </p>
    <p th:if="${order.member == null}"><span class="tag">非會員</span></p>

    <form th:action="@{/bistroops/feedback/qr}" method="post">
      <input type="hidden" name="token" th:value="${token}">

      <th:block th:if="${order.member == null}">
        <label for="qrName">姓名</label>
        <input type="text" id="qrName" name="name" maxlength="20" required>
        <label for="qrTel">手機號碼</label>
        <input type="tel" id="qrTel" name="tel" maxlength="10" pattern="09\d{8}" placeholder="09xxxxxxxx" required>
      </th:block>

      <label>評分</label>
      <div class="stars">
        <input type="radio" id="s5" name="rating" value="5" required><label for="s5">★</label>
        <input type="radio" id="s4" name="rating" value="4"><label for="s4">★</label>
        <input type="radio" id="s3" name="rating" value="3"><label for="s3">★</label>
        <input type="radio" id="s2" name="rating" value="2"><label for="s2">★</label>
        <input type="radio" id="s1" name="rating" value="1"><label for="s1">★</label>
      </div>

      <label for="qrContent">回饋內容</label>
      <textarea id="qrContent" name="content" rows="5" maxlength="500" required></textarea>

      <p class="error" th:if="${errorMsg}" th:text="${errorMsg}"></p>
      <button type="submit">送出回饋</button>
    </form>
  </th:block>

</div>
</body>
</html>
