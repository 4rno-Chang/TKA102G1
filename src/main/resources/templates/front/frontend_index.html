<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops｜首頁</title>
<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<!-- front.css：前台共用（變數、頁首頁尾）；frontend_index.css：首頁自己的樣式（要寫在 front.css 後面） -->
<link rel="stylesheet" th:href="@{/css/front/front.css}" />
<link rel="stylesheet" th:href="@{/css/front/frontend_index.css}" />
<link rel="stylesheet" th:href="@{/css/front/hero-announcement.css}" />
<script th:src="@{/js/front/frontend_index.js}" defer></script>
<link rel="stylesheet" th:href="@{/css/front/member.css}" />
<script th:src="@{/js/front/member.js}" defer></script>
</head>

<body>
	<div th:replace="~{front/member/member_modals :: modals}"></div>
	<!-- ========== Header ========== -->
	<header th:replace="~{front/front_layout :: header('')}"></header>
	<main>
		<!-- ========== Hero ========== -->
		<section class="hero">
			<div class="hero-text">
				<p class="eyebrow">Bistro · Table · Wine</p>
				<h1>Bistroops！</h1>
				<p>副標題</p>
				<a th:href="@{/bistroops/reservation}" class="btn-outline">立即訂位</a>
			</div>
	<!-- 輪播：最新的公告（之後加上活動），最多 5 張，點了到那一則公告。
	資料由 IndexController_inSpringBoot 的 frontIndex 先查好放進 Model（heroSlides ＝ HeroSlideService.getHeroSlides()），
	在 Controller 查：資料庫出錯時會顯示 500 錯誤頁，不會只出現半頁。
	規則都寫在 HeroSlideService：公告＋活動依日期新到舊取 5 張；某一種一則都沒有時放它的空位圖
	（slide-no-announcement.svg、slide-no-promote.svg）；不足 5 張時最後補一張訂位圖（promo-reservation.svg）。
	每一張的 slide.title／href／imgSrc／kind 說明在 HeroSlideService 開頭。

	圖片固定用 16:9 顯示，並拉開填滿整個框（frontend_index.css 的 .slide img { object-fit: fill }）：
     其他比例的圖片會被拉成 16:9（會變形），不留白、不裁切。後台活動管理的預覽用的是同樣的設定。
     標題條、沒有圖片時的 logo 樣式在 hero-announcement.css。

     【接活動】前台活動頁和前台的活動圖片網址（例如 GET /bistroops/promote/img?promoteNo=1，不要直接連 /staff）做好之後，
     打開 HeroSlideService 裡標示【接活動】的幾行就會一起輪播，這個檔案不用改。
     輪播的圓點是 frontend_index.js 依照 slide 的數量自動產生的；清單至少有一張（訂位圖或空位圖），不會是空的。 -->

			<div class="carousel" id="carousel">
				<div class="carousel-track">
					<a class="slide" th:each="slide : ${heroSlides}" th:href="@{${slide.href}}">
						<img th:if="${slide.imgSrc != null}" th:src="@{${slide.imgSrc}}" th:alt="${slide.title}">
						<div class="slide-empty" th:if="${slide.imgSrc == null}">
							<img th:src="@{/images/logo-mark.svg}" alt="">
						</div>
						<!-- 左上角的公告／活動名稱：只有沒有圖片的那一張才顯示（有圖片時，圖片本身就有標題） -->
						<span class="slide-caption" th:if="${slide.imgSrc == null and (slide.kind == 'announcement' or slide.kind == 'promote')}"
							th:text="${slide.title}"></span>
					</a>
				</div>
				<button class="carousel-arrow prev" aria-label="上一張">‹</button>
				<button class="carousel-arrow next" aria-label="下一張">›</button>
				<div class="carousel-dots"></div>
			</div>
		</section>

		<!-- ========== 精選菜單 ========== -->
		<section class="section reveal" id="menu">
			<div class="container">
				<p class="eyebrow">Our Menu</p>
				<h2 class="section-title">精選菜單</h2>
				<!-- 三張圖只是展示，不是連結；要看菜單按下面的「查看完整菜單」
				     圖片和「瀏覽菜單」頁每個類別上方的代表圖用同一套規則（menu.html 的 cover）：
				       ① 後台「設為類別代表」選的菜（menuCovers，存在 Redis）
				       ② 沒有設定 → 那個類別第一道有圖片的菜　③ 都沒有圖片 → 插圖
				     每張卡片找一個類別（和 menu.html 選插圖的規則一樣）：
				       開胃菜＝標籤「前菜」的第一個類別、甜點＝標籤「甜點」的、主餐＝其他標籤的
				     card 的四個值：要找的標籤、卡片上的中文、英文、插圖檔名
				     __${...}__ 是先把值填進去再算（.^[ ] 裡面只看得到類別自己的欄位，看不到 card、pick，要先填好）
				     Controller 沒有放 menuSections（是 null）時，三張都用插圖
				     background-image 放兩層：菜的圖片在上、插圖在下，菜的圖片讀不到時就會看到插圖 -->
				<div class="menu-grid">
					<th:block th:each="card : ${ { {'前菜','開胃菜','Appetizer','dish-appetizer.svg'},
					                              {'主餐','主餐','main course','dish-main.svg'},
					                              {'甜點','甜點','dessert','dish-dessert.svg'} } }"
						th:with="sec=${menuSections == null ? null
						             : card[0] == '主餐' ? menuSections.^[meals[0].tagCode != '前菜' and meals[0].tagCode != '甜點']
						             : menuSections.^[meals[0].tagCode == '__${card[0]}__']},
						         pick=${sec != null and menuCovers != null ? menuCovers[sec.mealtypeNo] : null}">
						<div class="menu-card placeholder"
							th:with="cover=${sec == null ? null : (sec.meals.^[mealNo == __${pick ?: -1}__ and hasImg] ?: sec.meals.^[hasImg])},
							         art=@{/images/{f}(f=${card[3]})}"
							th:style="${cover != null}
							          ? |background-image: url('@{/bistroops/order/mealImg(mealNo=${cover.mealNo})}'), url('${art}')|
							          : |background-image: url('${art}')|"><span
							class="menu-card-text">[[${card[1]}]]<small th:text="${card[2]}">Appetizer</small></span></div>
					</th:block>
				</div>
				<div class="btn-center">
					<a th:href="@{/bistroops/menu}" class="btn-outline">查看完整菜單</a>
				</div>
			</div>
		</section>

		<!-- ========== 常見問題 ========== -->
		<section class="section reveal" id="faq">
			<div class="container">
				<p class="eyebrow">FAQ</p>
				<h2 class="section-title">常見問題</h2>
				<!-- 內容來自資料庫的 qa 表：由 IndexController_inSpringBoot 的 frontIndex 放進 Model（popularQaList ＝ QaService.getPopular(5)），
				     只顯示點擊最多的 5 題；全部的問答在「more→」連到的 /bistroops/qa（FrontQaController）。
				     點問題展開答案的效果在 frontend_index.js「3. 常見問題」；
				     展開時 qa-click.js 送出點擊次數（網址在 data-click-url） -->
				<div class="faq-list" id="faqList" th:with="qaList=${popularQaList}">
					<p th:if="${#lists.isEmpty(qaList)}">目前沒有常見問題</p>
					<div class="faq-item" th:each="qa : ${qaList}"
						th:attr="data-click-url=@{/bistroops/qa/{no}/click(no=${qa.qaNo})}">
						<button class="faq-question" aria-expanded="false">
							<span th:text="|Q：${qa.qaTitle}|"></span>
							<span class="faq-icon">+</span>
						</button>
						<div class="faq-answer"><p th:text="|A：${qa.qaContent}|"></p></div>
					</div>
				</div>
				<div class="btn-center">
					<a th:href="@{/bistroops/qa}" class="btn-outline">more→</a>
				</div>
			</div>
			<script th:src="@{/js/front/qa-click.js}" defer></script>
		</section>

		<!-- ========== 關於我們 ========== -->
		<section class="section reveal" id="about">
			<div class="container">
				<!-- 背景是店面插圖 images/bistroops.jpg，標題在圖片最下面；滑鼠移入或點擊後，理念文字從圖片下方出現
             （樣式在 frontend_index.css「4. 關於我們」，點擊在 frontend_index.js 的 aboutBox） -->
				<div class="about-box placeholder" id="aboutBox" role="button"
					tabindex="0" aria-expanded="false">
					<span class="about-title">關於我們</span>
					<p class="about-overlay">
						Bistroops 相信，好的料理不必拘謹。<br> 我們挑選當季食材，用心對待每一道菜，<br>
						再配上一杯好酒，讓每一次相聚都自在而難忘。
					</p>
				</div>
			</div>
		</section>
	</main>

	<!-- ========== Footer ========== -->
	<footer th:replace="~{front/front_layout :: footer}"></footer>
	<button th:replace="~{front/front_layout :: backToTop}"></button>

</body>

</html>
