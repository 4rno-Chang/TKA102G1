<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops｜預約訂位｜填寫聯絡資料</title>
<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
	href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap">
<link rel="stylesheet" th:href="@{/css/front/front.css}" />
<link rel="stylesheet" th:href="@{/css/front/member.css}" />
<link rel="stylesheet" th:href="@{/css/front/reservation.css}" />
<script th:src="@{/js/front/member.js}" defer></script>

</head>

<!--
  預約訂位 步驟二：填寫聯絡資料
  網址：/bistroops/reservation/contact

  ※ 目前是假資料：步驟一選好的日期、桌型、時段是 reservation.js 暫存在瀏覽器裡帶過來的，
    送出後也只是由 reservation.js 產生一個訂位編號，沒有真的存起來（見 reservation.js 第 5 區）。

  ※ 有登入會員時，姓名、電話、Email 會自動帶入，這部分「不是」假資料：
    會員登入後 MemberController 會把會員物件存在 session（名稱是 member），
    下面三個輸入框用 th:value="${session.member?.memName}" 這樣的寫法直接取出來。
    member 後面的問號不能省略：沒登入時 session.member 是 null，少了問號頁面會出錯。
    對應的欄位是 MemberVO 的 memName、memTel、memMail，會員的欄位名稱如果改了，這裡要跟著改。

  【Thymeleaf 串接】接上資料庫後，Controller 要放進 Model 的值：
    rsvDtNo     步驟一選好的時段編號（「訂位時段 reservation_datetime」的 rsv_dt_no）
    tableType   步驟一選好的桌型
    dateText／timeText   顯示用的日期與時間（用 rsvDtNo 從資料庫查出來）
    error       送出後資料有問題時的錯誤訊息；沒有問題是 null
    name／phone／email／note   送出後被退回時，客人原本填的內容（第一次進來時都是 null）
  要改的地方往下搜尋「Thymeleaf 串接」，共 4 處。
-->

<body>
	<div th:replace="~{front/member/member_modals :: modals}"></div>
	<header th:replace="~{front/front_layout :: header('reservation')}"></header>

	<main class="booking">
		<div class="container">

			<header class="booking-head">
				<p class="eyebrow">Reservation</p>
				<h1 class="booking-title">預約訂位</h1>
				<p class="booking-lead">填寫聯絡資料並送出，即可完成訂位。</p>
			</header>

			<!-- 三個步驟：第一步已完成，目前在第二步 -->
			<ol class="booking-steps">
				<li class="done"><span class="step-no">1</span>選擇日期與桌型</li>
				<li class="active"><span class="step-no">2</span>填寫聯絡資料</li>
				<li><span class="step-no">3</span>確認訂位</li>
			</ol>

			<div class="booking-layout">

				<!-- ========== 左：聯絡資料 ========== -->
				<section class="booking-card">
					<h2 class="booking-card-title">
						填寫聯絡資料 <small class="required-note"><b>*</b> 必填</small>
					</h2>

					<!-- 還沒登入時，提醒可以先登入（登入後資料會自動帶入） -->
					<p class="booking-tip" th:if="${session.member == null}">
						已經是會員？
						<button type="button" class="link-btn" data-open-auth>登入</button>
						後會自動帶入您的姓名與電話。
					</p>

					<!-- 【Thymeleaf 串接 1】表單
               下面那行 form 換成（送到 Controller 檢查並存進資料庫）：
                 <form id="contactForm" th:action="@{/bistroops/reservation/submit}" method="post" novalidate>
               並在表單裡加兩個隱藏欄位，把步驟一選好的內容一起送出：
                 <input type="hidden" name="rsvDtNo" th:value="${rsvDtNo}">
                 <input type="hidden" name="tableType" th:value="${tableType}">
               備註存進 reservation 的 rsv_comment，那個欄位最多 50 字，所以輸入框的 maxlength 是 50。

               訂位 reservation 只存會員編號 mem_no，沒有姓名、電話、Email 的欄位。Controller 收到表單後：
                 有登入 → 直接用 session 裡會員的 mem_no
                 沒登入 → 用 phone 查會員（mem_tel）；查得到就用那位會員的 mem_no，
                          查不到就先用 name、phone、email 新增一位會員，再用新的 mem_no
               Email 會存進會員的 mem_mail（最多 30 字），所以輸入框的 maxlength 是 30。
               詳細說明與要留意的地方寫在 reservation.js 第 1 區開頭。 -->
					<form id="contactForm" th:action="@{/bistroops/reservation/submit}"
						method="post">
						<input type="hidden" name="date" th:value="${date}"> <input
							type="hidden" name="tableType" th:value="${tableType}"> <input
							type="hidden" name="rsvDtNo" th:value="${rsvDtNo}">

						<!-- 【Thymeleaf 串接 2】輸入框的預設值
                 送出後如果被 Controller 退回（資料有問題），要顯示客人剛剛填的內容，不是會員資料。
                 所以三個 th:value 前面各加上「${name} ?: 」這樣的寫法：
                   姓名   th:value="${name} ?: ${session.member?.memName}"
                   電話   th:value="${phone} ?: ${session.member?.memTel}"
                   Email  th:value="${email} ?: ${session.member?.memMail}"
                 意思是：name 有值就用 name，沒有才用會員資料。
                 備註的 textarea 加上 th:text="${note}"。 -->
						<div class="field">
							<label for="resvName">聯絡人姓名 <b class="required">*</b></label> <input
								type="text" id="resvName" th:value="${member.memName}" readonly>
						</div>

						<div class="field">
							<label for="resvPhone">聯絡電話 <b class="required">*</b></label> <input
								type="tel" id="resvPhone" th:value="${member.memTel}" readonly>
						</div>

						<div class="field">
							<label for="resvEmail">電子郵件（選填）</label> <input type="email"
								id="resvEmail" th:value="${member.memMail}" readonly>
						</div>

						<div class="field">
							<label for="resvNote">備註（選填）</label>
							<textarea id="resvNote" name="note" rows="4" maxlength="50"
								placeholder="例如：兒童椅或其他需求，仍須由餐廳確認。" data-summary="sumNote"></textarea>
						</div>

						<label class="check-row"> <input type="checkbox"
							name="agree" value="yes" id="resvAgree" required> <span>我已閱讀訂位須知及個人資料使用說明。</span>
						</label>

						<!-- 錯誤訊息：reservation.js 在送出前檢查不通過時會顯示在這裡。
                 【Thymeleaf 串接 3】Controller 檢查不通過時也要顯示在這裡，把這一行換成：
                   <p class="form-msg error booking-error" id="contactError" th:text="${error}" th:hidden="${error == null}"></p> -->
						<p class="form-msg error booking-error" id="contactError" hidden></p>

						<div class="booking-actions">
							<!-- 上一步：回到步驟一（之前選的日期、桌型、時段，reservation.js 有暫存，回去後還在）。
                   【Thymeleaf 串接 4】改成用網址把選好的內容帶回去：
                     <a class="btn-outline" th:href="@{/bistroops/reservation(date=${date}, tableType=${tableType}, rsvDtNo=${rsvDtNo})}">上一步</a>
                   右邊摘要的日期、桌型、時段三個 dd 加上 th:text：
                     th:text="${dateText}"、th:text="|${tableType} 人桌|"、th:text="${timeText}" -->
							<a class="btn-outline"
								th:href="@{/bistroops/reservation(
									       date=${date},
									       tableType=${tableType}
									   )}">
								上一步 </a>

							<button type="submit" class="btn-solid">確認送出訂位</button>
						</div>
					</form>
				</section>

				<!-- ========== 右：訂位摘要（由 reservation.js 填入；聯絡資料會跟著輸入的內容即時更新） ========== -->
				<aside class="booking-summary">
					<h2 class="booking-card-title">訂位摘要</h2>
					<dl class="summary-list">
						<div>
							<dt>日期</dt>
							<dd th:text="${dateText}"></dd>
						</div>

						<div>
							<dt>桌型</dt>
							<dd th:text="|${tableType} 人桌|"></dd>
						</div>

						<div>
							<dt>時段</dt>
							<dd th:text="${timeText}"></dd>
						</div>

						<div>
							<dt>聯絡人姓名</dt>
							<dd th:text="${member.memName}"></dd>
						</div>

						<div>
							<dt>聯絡電話</dt>
							<dd th:text="${member.memTel}"></dd>
						</div>

						<div>
							<dt>電子郵件</dt>
							<dd
								th:text="${#strings.isEmpty(member.memMail)
                  ? '未提供' : member.memMail}"></dd>
						</div>
					</dl>
					<p class="summary-status">目前尚未完成訂位</p>
				</aside>

			</div>
		</div>
	</main>

	<footer th:replace="~{front/front_layout :: footer}"></footer>
	<button th:replace="~{front/front_layout :: backToTop}"></button>
</body>

</html>
