<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bistroops｜填寫訂位資料</title>

<link rel="icon" th:href="@{/images/logo-mark.svg}" type="image/svg+xml">
<link rel="stylesheet" th:href="@{/css/front/front.css}">
<link rel="stylesheet" th:href="@{/css/front/member.css}">
<link rel="stylesheet" th:href="@{/css/front/reservation.css}">
<link rel="stylesheet" th:href="@{/css/front/booking-loading.css}">

<script th:src="@{/js/front/member.js}" defer></script>
<script th:src="@{/js/front/announcement.js}" defer></script>
<script th:src="@{/js/front/booking-loading.js}" defer></script>
</head>
<body>
	<div th:replace="~{front/member/member_modals :: modals}"></div>
	<header th:replace="~{front/front_layout :: header('reservation')}"></header>

	<main class="booking">
		<div class="container">
			<header class="booking-head">
				<p class="eyebrow">Reservation</p>
				<h1 class="booking-title">預約訂位</h1>
				<p class="booking-lead">不需登入，填寫電話即可送出訂位。</p>
			</header>

			<ol class="booking-steps">
				<li><span class="step-no">✓</span>選擇日期與桌型</li>
				<li class="active"><span class="step-no">2</span>填寫聯絡資料</li>
				<li><span class="step-no">3</span>確認訂位</li>
			</ol>

			<div class="booking-layout">
				<section class="booking-card">
					<h2 class="booking-card-title">填寫訂位資料</h2>

					<p class="form-msg error" role="alert" th:if="${error != null}"
						th:text="${error}"></p>

					<form th:action="@{/bistroops/reservation/submit}" method="post" data-loading>

						<input type="hidden" name="date" th:value="${date}"> <input
							type="hidden" name="tableType" th:value="${tableType}"> <input
							type="hidden" name="rsvDtNo" th:value="${rsvDtNo}"> <input
							type="hidden" name="reservationFormToken"
							th:value="${reservationFormToken}">

						<div class="field">
							<label for="bookingName">聯絡姓名（選填）</label> <input type="text"
								id="bookingName" name="bookingName" autocomplete="name"
								maxlength="30" placeholder="請輸入聯絡姓名" th:value="${bookingName}">
						</div>

						<div class="field">
							<label for="bookingPhone">聯絡電話 *</label> <input type="tel"
								id="bookingPhone" name="phone" inputmode="numeric"
								autocomplete="tel" minlength="10" maxlength="10"
								pattern="09[0-9]{8}" placeholder="09XXXXXXXX" required
								th:value="${phone}">
						</div>

						<div class="field">
							<label for="bookingNote">備註（選填，最多50個字元）</label>

							<textarea id="bookingNote" name="note" rows="4" maxlength="50"
								th:text="${note}"></textarea>
						</div>

						<p class="booking-tip">此電話尚無帳號時，系統會建立未驗證帳號。
							姓名及其他會員資料，請於電話驗證後填寫。</p>

						<label> <input type="checkbox" name="agree" value="yes"
							required> 我已閱讀訂位須知及個人資料使用說明。
						</label>

						<div
							style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
							<a class="btn-outline"
								th:href="@{/bistroops/reservation(
                               date=${date}, tableType=${tableType})}">
								上一步 </a>

							<button type="submit" class="btn-solid">確認送出訂位</button>
						</div>
					</form>
				</section>

				<aside class="booking-summary">
					<h2 class="booking-card-title">訂位摘要</h2>

					<dl class="summary-list">
						<div>
							<dt>日期</dt>
							<dd th:text="${dateText}"></dd>
						</div>
						<div>
							<dt>桌型</dt>
							<dd th:text="|${tableType} 人桌|"></dd>
						</div>
						<div>
							<dt>時段</dt>
							<dd th:text="${timeText}"></dd>
						</div>
					</dl>

					<p class="summary-status">目前尚未完成訂位</p>
					<p class="summary-hint">送出後會再次確認剩餘桌數。</p>
				</aside>
			</div>
		</div>
	</main>

	<footer th:replace="~{front/front_layout :: footer}"></footer>
	<button th:replace="~{front/front_layout :: backToTop}"></button>
</body>
</html>
